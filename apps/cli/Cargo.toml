[package]
name = "mohub"
version = "0.3.6"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/marimo-team/marimohub"
rust-version = "1.88"
description = "Fast, cross-platform CLI for marimohub"
authors = ["marimo team"]
homepage = "https://github.com/marimo-team/marimohub"
readme = "../../README.md"

[dependencies]
clap = { version = "4.5.32", features = ["env", "string"] }
clap_complete = "4.5.46"
clap_complete_nushell = "4.6.2"
clap_mangen = "0.3.2"
csv = "1.3.1"
directories = "6.0.0"
base64 = "0.22.1"
fs2 = "0.4.3"
getrandom = "0.4.3"
indicatif = "0.18.6"
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
keyring = { version = "3.6.2", features = [
	"apple-native",
	"vendored",
	"windows-native",
	"sync-secret-service",
] }
miette = { version = "7.6.0", features = ["fancy"] }
secrecy = "0.10.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tabled = { version = "0.21.0", default-features = false, features = ["std"] }
tempfile = "3.20.0"
thiserror = "2.0.12"
update-informer = { version = "1.3.0", default-features = false, features = [
	"github",
	"ureq",
	"rustls-tls",
] }
ureq = { version = "2.12.1", features = ["json"] }
url = "2.5.4"
urlencoding = "2.1.3"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
