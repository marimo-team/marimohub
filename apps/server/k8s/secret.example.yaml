# Copy to secret.yaml and fill in real values (do NOT commit secret.yaml).
# Or create it imperatively:
#   kubectl create secret generic marimohub-secrets \
#     --from-literal=MARIMOHUB_STORAGE_S3_ACCESS_KEY_ID=... \
#     --from-literal=MARIMOHUB_STORAGE_S3_SECRET_ACCESS_KEY=... \
#     --from-literal=MARIMOHUB_AUTH_OIDC_CLIENT_SECRET=... \
#     --from-literal=MARIMOHUB_AUTH_SESSION_SECRET=... \
#     --from-literal=MARIMOHUB_COMPUTE_MODAL_TOKEN_ID=... \
#     --from-literal=MARIMOHUB_COMPUTE_MODAL_TOKEN_SECRET=...
apiVersion: v1
kind: Secret
metadata:
  name: marimohub-secrets
type: Opaque
stringData:
  MARIMOHUB_STORAGE_S3_ACCESS_KEY_ID: 'CHANGE_ME'
  MARIMOHUB_STORAGE_S3_SECRET_ACCESS_KEY: 'CHANGE_ME'
  MARIMOHUB_AUTH_OIDC_CLIENT_SECRET: 'CHANGE_ME'
  MARIMOHUB_AUTH_SESSION_SECRET: 'CHANGE_ME'
  MARIMOHUB_COMPUTE_MODAL_TOKEN_ID: 'CHANGE_ME'
  MARIMOHUB_COMPUTE_MODAL_TOKEN_SECRET: 'CHANGE_ME'
