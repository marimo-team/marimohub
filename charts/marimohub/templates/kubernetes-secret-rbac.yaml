{{- if .Values.secretResolvers.kubernetes.enabled -}}
{{- if not .Values.serviceAccount.automountServiceAccountToken -}}
{{- fail "serviceAccount.automountServiceAccountToken must be true when the Kubernetes Secret resolver is enabled" -}}
{{- end -}}
{{- $rules := .Values.secretResolvers.kubernetes.allowedSecrets -}}
{{- if not $rules -}}
{{- fail "secretResolvers.kubernetes.allowedSecrets must contain at least one Secret when enabled" -}}
{{- end -}}
{{- if not (regexMatch "^(0|[1-9][0-9]*)$" (printf "%v" .Values.secretResolvers.kubernetes.cacheTtlSeconds)) -}}
{{- fail "secretResolvers.kubernetes.cacheTtlSeconds must be a non-negative integer" -}}
{{- end -}}
{{- $allowedFields := list "namespace" "name" "projects" -}}
{{- $seenSecrets := dict -}}
{{- $byNamespace := dict -}}
{{- range $index, $rule := $rules -}}
{{- $position := add1 $index -}}
{{- if not (kindIs "map" $rule) -}}
{{- fail (printf "secretResolvers.kubernetes.allowedSecrets rule %d must be an object" $position) -}}
{{- end -}}
{{- range $field, $_ := $rule -}}
{{- if not (has $field $allowedFields) -}}
{{- fail (printf "secretResolvers.kubernetes.allowedSecrets rule %d contains an unknown field" $position) -}}
{{- end -}}
{{- end -}}
{{- $namespace := $rule.namespace -}}
{{- if not (kindIs "string" $namespace) -}}
{{- fail (printf "secretResolvers.kubernetes.allowedSecrets rule %d has an invalid namespace" $position) -}}
{{- end -}}
{{- if or (gt (len $namespace) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $namespace)) -}}
{{- fail (printf "secretResolvers.kubernetes.allowedSecrets rule %d has an invalid namespace" $position) -}}
{{- end -}}
{{- $name := $rule.name -}}
{{- if not (kindIs "string" $name) -}}
{{- fail (printf "secretResolvers.kubernetes.allowedSecrets rule %d has an invalid Secret name" $position) -}}
{{- end -}}
{{- if or (not $name) (gt (len $name) 253) -}}
{{- fail (printf "secretResolvers.kubernetes.allowedSecrets rule %d has an invalid Secret name" $position) -}}
{{- end -}}
{{- range $label := splitList "." $name -}}
{{- if or (gt (len $label) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $label)) -}}
{{- fail (printf "secretResolvers.kubernetes.allowedSecrets rule %d has an invalid Secret name" $position) -}}
{{- end -}}
{{- end -}}
{{- $secretKey := printf "%s/%s" $namespace $name -}}
{{- if hasKey $seenSecrets $secretKey -}}
{{- fail (printf "secretResolvers.kubernetes.allowedSecrets rule %d duplicates an earlier Secret" $position) -}}
{{- end -}}
{{- $_ := set $seenSecrets $secretKey true -}}
{{- $projects := $rule.projects -}}
{{- if kindIs "string" $projects -}}
{{- if ne $projects "*" -}}
{{- fail (printf "secretResolvers.kubernetes.allowedSecrets rule %d projects must be '*' or a non-empty project ID array" $position) -}}
{{- end -}}
{{- else if kindIs "slice" $projects -}}
{{- if eq (len $projects) 0 -}}
{{- fail (printf "secretResolvers.kubernetes.allowedSecrets rule %d projects must be '*' or a non-empty project ID array" $position) -}}
{{- end -}}
{{- $seenProjects := dict -}}
{{- range $project := $projects -}}
{{- if or (not (kindIs "string" $project)) (not (regexMatch "^proj-[0-9a-z]{16}$" $project)) -}}
{{- fail (printf "secretResolvers.kubernetes.allowedSecrets rule %d contains an invalid project ID" $position) -}}
{{- end -}}
{{- if hasKey $seenProjects $project -}}
{{- fail (printf "secretResolvers.kubernetes.allowedSecrets rule %d contains a duplicate project ID" $position) -}}
{{- end -}}
{{- $_ := set $seenProjects $project true -}}
{{- end -}}
{{- else -}}
{{- fail (printf "secretResolvers.kubernetes.allowedSecrets rule %d projects must be '*' or a non-empty project ID array" $position) -}}
{{- end -}}
{{- $names := get $byNamespace $namespace | default (dict) -}}
{{- $_ := set $names $name true -}}
{{- $_ := set $byNamespace $namespace $names -}}
{{- end -}}
{{- range $namespace := keys $byNamespace | sortAlpha -}}
{{- $names := keys (get $byNamespace $namespace) | sortAlpha -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-secret-reader-%s" (include "marimohub.fullname" $) (sha256sum $namespace | trunc 8) | trunc 63 | trimSuffix "-" }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "marimohub.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml $names | nindent 6 }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-secret-reader-%s" (include "marimohub.fullname" $) (sha256sum $namespace | trunc 8) | trunc 63 | trimSuffix "-" }}
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "marimohub.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "marimohub.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-secret-reader-%s" (include "marimohub.fullname" $) (sha256sum $namespace | trunc 8) | trunc 63 | trimSuffix "-" }}
{{ end -}}
{{- end -}}
