openapi: 3.1.0
info:
  title: marimohub integration kinds
  version: 1.0.0
  description: |-
    Machine-checkable description of every integration kind registered in
    `defaultRegistry()` (`packages/core/src/services/integrations/kinds/`),
    generated from each kind’s zod config schema (input io, so defaulted
    fields stay optional). This is not an HTTP API: each path stands for a
    kind, and its component schema is the config contract stored in
    `versions/{n}.json` records and rendered into sandboxes.
paths:
  /kinds/athena/config:
    summary: Amazon Athena
    description: Query S3 data with Athena through PyAthena and SQLAlchemy.
    x-kind-schema-version: 1
    x-category: engine
    x-brand-color: '#8C4FFF'
    x-secret-paths:
      - auth.access_key_id
      - auth.secret_access_key
      - auth.session_token
    x-supports-test: false
    x-requirements:
      - pyathena[sqlalchemy]>=3.9
    get:
      operationId: read_athena_config
      summary: Stored athena config
      responses:
        '200':
          description: A stored config every reader and migration must accept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/athena'
    put:
      operationId: write_athena_config
      summary: Input athena config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/athena'
      responses:
        '204':
          description: Accepted.
