components:
  schemas:
    athena:
      type: object
      properties:
        region:
          type: string
          pattern: ^[a-z0-9-]+$
        s3_staging_dir:
          type: string
          pattern: ^s3:\/\/(?![^/]*@)[^\s?#]+$
          description: Bucket prefix Athena writes query results to
        database:
          default: default
          type: string
          pattern: ^[A-Za-z0-9_]+$
        workgroup:
          default: primary
          type: string
          pattern: ^[A-Za-z0-9._-]+$
        catalog:
          default: AwsDataCatalog
          type: string
          pattern: ^[A-Za-z0-9._-]+$
        auth:
          default:
            method: ambient
          oneOf:
            - type: object
              properties:
                method:
                  type: string
                  const: ambient
              required:
                - method
            - type: object
              properties:
                method:
                  type: string
                  const: static
                access_key_id:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
                secret_access_key:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
                session_token:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - access_key_id
                - secret_access_key
      required:
        - region
        - s3_staging_dir
    azure_blob:
      type: object
      properties:
        account_name:
          type: string
          pattern: ^[a-z0-9]{3,24}$
        container:
          description: Default container for notebook code
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$
        endpoint_suffix:
          default: core.windows.net
          description: Sovereign clouds use their own, e.g. core.chinacloudapi.cn
          type: string
          pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$
        auth:
          oneOf:
            - type: object
              properties:
                method:
                  type: string
                  const: ambient
              required:
                - method
            - type: object
              properties:
                method:
                  type: string
                  const: account_key
                account_key:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - account_key
            - type: object
              properties:
                method:
                  type: string
                  const: sas_token
                sas_token:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - sas_token
            - type: object
              properties:
                method:
                  type: string
                  const: connection_string
                connection_string:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - connection_string
            - type: object
              properties:
                method:
                  type: string
                  const: service_principal
                tenant_id:
                  type: string
                  minLength: 1
                client_id:
                  type: string
                  minLength: 1
                client_secret:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - tenant_id
                - client_id
                - client_secret
        ambient_env:
          default: true
          description: Also export the vendor-standard variables so libraries pick this up
            with no configuration. Only one integration per session can claim
            them.
          type: boolean
      required:
        - account_name
        - auth
    bigquery:
      type: object
      properties:
        project_id:
          type: string
          pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$
          description: Google Cloud project that owns the datasets
        dataset:
          description: Default dataset for unqualified table names
          type: string
          pattern: ^[A-Za-z0-9_]+$
        location:
          description: Dataset location, e.g. US or europe-west4
          type: string
          minLength: 1
        auth:
          default:
            method: ambient
          oneOf:
            - type: object
              properties:
                method:
                  type: string
                  const: ambient
              required:
                - method
            - type: object
              properties:
                method:
                  type: string
                  const: service_account
                credentials_json:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - credentials_json
        ambient_env:
          default: false
          description: Also export the vendor-standard variables so libraries pick this up
            with no configuration. Only one integration per session can claim
            them.
          type: boolean
      required:
        - project_id
    clickhouse:
      type: object
      properties:
        host:
          type: string
          pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$
          description: Server hostname, e.g. abc123.us-east-1.aws.clickhouse.cloud
        port:
          default: 8443
          description: HTTP interface port
          type: integer
          minimum: 1
          maximum: 65535
        secure:
          default: true
          description: Use HTTPS for the HTTP interface
          type: boolean
        verify:
          default: true
          description: Verify the server certificate (clickhouse-connect `verify`)
          type: boolean
        database:
          default: default
          type: string
          minLength: 1
        username:
          default: default
          type: string
          minLength: 1
        password:
          description: Omit for a user with no password
          type: string
          minLength: 1
          x-marimohub-secret: true
      required:
        - host
    custom_env:
      type: object
      properties:
        vars:
          default: {}
          description: Plain environment variables, visible to project admins
          type: object
          propertyNames:
            type: string
            pattern: ^[A-Z_][A-Z0-9_]*$
          additionalProperties:
            type: string
        secrets:
          default: []
          description: Secret environment variables from encrypted values or an external
            manager
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                pattern: ^[A-Z_][A-Z0-9_]*$
              value:
                type: string
                minLength: 1
                x-marimohub-secret: true
            required:
              - name
              - value
        secret_bundles:
          default: []
          description: JSON secret objects expanded into one environment variable per key
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                minLength: 1
                x-marimohub-secret: true
                description: A JSON object containing environment variable values
              prefix:
                type: string
                pattern: ^[A-Z_][A-Z0-9_]*$
            required:
              - value
    databricks:
      type: object
      properties:
        host:
          type: string
          pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$
          description: Workspace hostname, e.g. dbc-1234abcd-5678.cloud.databricks.com
        http_path:
          type: string
          pattern: ^\/[A-Za-z0-9._\-/]+$
          description: SQL warehouse or cluster HTTP path
        auth:
          oneOf:
            - type: object
              properties:
                method:
                  type: string
                  const: personal_access_token
                token:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - token
            - type: object
              properties:
                method:
                  type: string
                  const: oauth_m2m
                client_id:
                  type: string
                  minLength: 1
                client_secret:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - client_id
                - client_secret
        catalog:
          description: Unity Catalog name for unqualified tables
          type: string
          minLength: 1
        schema:
          description: Session default schema
          type: string
          minLength: 1
      required:
        - host
        - http_path
        - auth
    gcs:
      type: object
      properties:
        bucket:
          description: Default bucket for notebook code; the credentials are not
            restricted to it
          type: string
          pattern: ^(?=.{3,222}$)(?!.*[^.]{64})(?!goog)(?!.*google)(?!(?:\d{1,3}\.){3}\d{1,3}$)(?!.*\.\.)[a-z0-9][a-z0-9._-]*[a-z0-9]$
        project_id:
