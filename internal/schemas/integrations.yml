          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        secret_spark_config:
          default: []
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
              value:
                type: string
                minLength: 1
                x-marimohub-secret: true
            required:
              - name
              - value
      required:
        - host
    trino:
      type: object
      properties:
        host:
          type: string
          pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$
          description: Coordinator hostname, e.g. trino.internal
        port:
          default: 443
          type: integer
          minimum: 1
          maximum: 65535
        http_scheme:
          default: https
          type: string
          enum:
            - https
            - http
        user:
          description: Query user; defaults to the signed-in user
          type: string
          minLength: 1
        auth:
          oneOf:
            - type: object
              properties:
                method:
                  type: string
                  const: none
              required:
                - method
            - type: object
              properties:
                method:
                  type: string
                  const: basic
                username:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - username
                - password
            - type: object
              properties:
                method:
                  type: string
                  const: jwt
                token:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - token
            - type: object
              properties:
                method:
                  type: string
                  const: oauth2
              required:
                - method
            - type: object
              properties:
                method:
                  type: string
                  const: certificate
                client_certificate:
                  type: string
                  minLength: 1
                client_key:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - client_certificate
                - client_key
            - type: object
              properties:
                method:
                  type: string
                  const: kerberos
                krb5_config:
                  type: string
                  minLength: 1
                service_name:
                  type: string
                  minLength: 1
                mutual_authentication:
                  default: required
                  type: string
                  enum:
                    - required
                    - optional
                    - disabled
                force_preemptive:
                  default: false
                  type: boolean
                hostname_override:
                  type: string
                  minLength: 1
                sanitize_mutual_error_response:
                  default: true
                  type: boolean
                principal:
                  type: string
                  minLength: 1
                delegate:
                  default: false
                  type: boolean
              required:
                - method
            - type: object
              properties:
                method:
                  type: string
                  const: gssapi
                krb5_config:
                  type: string
                  minLength: 1
                service_name:
                  type: string
                  minLength: 1
                mutual_authentication:
                  default: disabled
                  type: string
                  enum:
                    - required
                    - optional
                    - disabled
                force_preemptive:
                  default: false
                  type: boolean
                hostname_override:
                  type: string
                  minLength: 1
                sanitize_mutual_error_response:
                  default: true
                  type: boolean
                principal:
                  type: string
                  minLength: 1
                delegate:
                  default: false
                  type: boolean
              required:
                - method
        tls:
          default:
            verification: system
          oneOf:
            - type: object
              properties:
                verification:
                  type: string
                  const: system
              required:
                - verification
            - type: object
              properties:
                verification:
                  type: string
                  const: disabled
              required:
                - verification
            - type: object
              properties:
                verification:
                  type: string
                  const: custom_ca
                ca_bundle:
                  type: string
                  minLength: 1
              required:
                - verification
                - ca_bundle
        default_catalog:
          type: string
          pattern: ^[A-Za-z0-9_.-]+$
        default_schema:
          type: string
          pattern: ^[A-Za-z0-9_.-]+$
        source:
          type: string
          minLength: 1
        session_properties:
          default: {}
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        roles:
          default: {}
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        client_tags:
          default: []
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                minLength: 1
            required:
              - value
        http_headers:
          default: []
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
              value:
                type: string
                minLength: 1
                x-marimohub-secret: true
            required:
              - name
              - value
        extra_credentials:
          default: []
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                pattern: ^[A-Za-z0-9_.-]+$
              value:
                type: string
                minLength: 1
                x-marimohub-secret: true
            required:
              - name
              - value
        timezone:
          type: string
          pattern: ^[A-Za-z0-9_+.-]+(?:\/[A-Za-z0-9_+.-]+)*$
        encoding:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                enum:
                  - json
                  - json+lz4
                  - json+zstd
            required:
              - value
        max_attempts:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        request_timeout_seconds:
          type: number
          exclusiveMinimum: 0
        heartbeat_interval_seconds:
          type: number
          exclusiveMinimum: 0
        isolation_level:
          default: AUTOCOMMIT
          type: string
          enum:
            - AUTOCOMMIT
            - READ_UNCOMMITTED
            - READ_COMMITTED
            - REPEATABLE_READ
            - SERIALIZABLE
        legacy_primitive_types:
          default: false
          type: boolean
        legacy_prepared_statements:
          type: boolean
      required:
        - host
        - auth
