                  const: prefer
              required:
                - mode
            - type: object
              properties:
                mode:
                  type: string
                  const: require
              required:
                - mode
            - type: object
              properties:
                mode:
                  type: string
                  const: verify-ca
                ca_bundle:
                  description: PEM CA bundle to trust, written into the session
                  type: string
                  minLength: 1
                ca_path:
                  description: Absolute path to a CA bundle the runtime already ships (default
                    /etc/ssl/certs/ca-certificates.crt)
                  type: string
                  minLength: 1
              required:
                - mode
            - type: object
              properties:
                mode:
                  type: string
                  const: verify-full
                ca_bundle:
                  description: PEM CA bundle to trust, written into the session
                  type: string
                  minLength: 1
                ca_path:
                  description: Absolute path to a CA bundle the runtime already ships (default
                    /etc/ssl/certs/ca-certificates.crt)
                  type: string
                  minLength: 1
              required:
                - mode
        ambient_env:
          default: false
          description: Also export PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD, and
            PGSSLMODE so marimo's data-source discovery offers this connection.
            Only one integration per session can claim them.
          type: boolean
      required:
        - host
        - database
        - username
        - password
    pyspark:
      type: object
      properties:
        host:
          type: string
          pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$
        port:
          default: 15002
          type: integer
          minimum: 1
          maximum: 65535
        use_ssl:
          default: true
          type: boolean
        auth:
          default:
            method: none
          oneOf:
            - type: object
              properties:
                method:
                  type: string
                  const: none
              required:
                - method
            - type: object
              properties:
                method:
                  type: string
                  const: token
                token:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - token
        user_id:
          type: string
          minLength: 1
        user_agent:
          type: string
          minLength: 1
          maxLength: 512
        app_name:
          type: string
          minLength: 1
        keepalive:
          default:
            enabled: true
            time_ms: 60000
            timeout_ms: 20000
            without_calls: true
          type: object
          properties:
            enabled:
              default: true
              type: boolean
            time_ms:
              default: 60000
              type: integer
              exclusiveMinimum: 0
              maximum: 9007199254740991
            timeout_ms:
              default: 20000
              type: integer
              exclusiveMinimum: 0
              maximum: 9007199254740991
            without_calls:
              default: true
              type: boolean
        metadata:
          default: []
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
              value:
                type: string
                minLength: 1
                x-marimohub-secret: true
            required:
              - name
              - value
        spark_config:
          default: {}
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        secret_spark_config:
          default: []
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
              value:
                type: string
                minLength: 1
                x-marimohub-secret: true
            required:
              - name
              - value
        ambient_env:
          default: false
          description: Also export SPARK_REMOTE so marimo's data-source discovery offers
            this connection. Only one integration per session can claim them.
          type: boolean
      required:
        - host
    redshift:
      type: object
      properties:
        host:
          type: string
          pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$
          description: Cluster or workgroup endpoint, e.g.
            wg.123456789012.us-east-1.redshift-serverless.amazonaws.com
        port:
          default: 5439
          type: integer
          minimum: 1
          maximum: 65535
        database:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          x-marimohub-secret: true
          description: Password for the database user
        ssl_mode:
          default: verify-ca
          type: string
          enum:
            - verify-ca
            - verify-full
      required:
        - host
        - database
        - username
        - password
    s3:
      type: object
      properties:
        bucket:
          description: Default bucket for notebook code; the credentials are not
            restricted to it
          type: string
          pattern: ^(?=.{3,63}$)(?!(?:\d{1,3}\.){3}\d{1,3}$)(?!.*\.\.)[a-z0-9][a-z0-9.-]*[a-z0-9]$
        region:
          description: Region name, e.g. us-east-1
          type: string
          pattern: ^[a-z0-9-]+$
        endpoint_url:
          description: S3-compatible endpoint, e.g. https://minio.internal:9000; omit for
            AWS S3
          type: string
          pattern: ^https?:\/\/(?![^/?#]*@)\S+$
        auth:
          default:
            method: ambient
          oneOf:
            - type: object
              properties:
                method:
                  type: string
                  const: ambient
              required:
                - method
            - type: object
              properties:
                method:
                  type: string
                  const: static
                access_key_id:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
                secret_access_key:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
                session_token:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - access_key_id
                - secret_access_key
        path_style:
          default: false
          description: Address buckets as `endpoint/bucket`, which most S3-compatible
            stores require
          type: boolean
        ambient_env:
          default: true
          description: Also export the vendor-standard variables so libraries pick this up
            with no configuration. Only one integration per session can claim
            them.
          type: boolean
    snowflake:
      type: object
      properties:
        account:
          type: string
          pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$
          description: Account identifier, e.g. myorg-account1
        user:
          type: string
          minLength: 1
        auth:
          oneOf:
            - type: object
              properties:
                method:
                  type: string
                  const: password
                password:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - password
            - type: object
              properties:
                method:
                  type: string
                  const: key_pair
                private_key:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
                  description: PKCS#8 private key PEM, written into the session
                private_key_passphrase:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - private_key
            - type: object
              properties:
                method:
                  type: string
                  const: oauth
                token:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - token
        warehouse:
          description: Warehouse the session runs on
          type: string
          minLength: 1
        database:
          description: Session default database
          type: string
          minLength: 1
        schema:
          description: Session default schema
          type: string
          minLength: 1
        role:
          description: Role the session assumes
          type: string
          minLength: 1
      required:
        - account
        - user
        - auth
    sqlserver:
      type: object
      properties:
        host:
          type: string
          pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$
          description: Server hostname, e.g. mssql.internal
        port:
          default: 1433
          type: integer
          minimum: 1
          maximum: 65535
        database:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          x-marimohub-secret: true
          description: Password for the database user
        driver:
          default:
            name: pyodbc
            odbc_driver: ODBC Driver 18 for SQL Server
            encrypt: true
            trust_server_certificate: false
          oneOf:
            - type: object
              properties:
                name:
                  type: string
                  const: pyodbc
                odbc_driver:
                  default: ODBC Driver 18 for SQL Server
                  description: Must be installed in the sandbox image
                  type: string
                  pattern: ^[A-Za-z0-9 ._-]+$
                encrypt:
                  default: true
                  type: boolean
                trust_server_certificate:
                  default: false
                  description: Accept any server certificate — encrypts without authenticating
                  type: boolean
              required:
                - name
            - type: object
              properties:
                name:
                  type: string
                  const: pymssql
              required:
                - name
      required:
        - host
        - database
        - username
        - password
    trino:
      type: object
      properties:
        host:
          type: string
          pattern: ^[A-Za-z0-9]([A-Za-z0-9._-]*[A-Za-z0-9])?$
          description: Coordinator hostname, e.g. trino.internal
        port:
          default: 443
          type: integer
          minimum: 1
          maximum: 65535
        http_scheme:
          default: https
          type: string
          enum:
            - https
            - http
        user:
          description: Query user; defaults to the signed-in user
          type: string
          minLength: 1
        auth:
          oneOf:
            - type: object
              properties:
                method:
                  type: string
                  const: none
              required:
                - method
            - type: object
              properties:
                method:
                  type: string
                  const: basic
                username:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - username
                - password
            - type: object
              properties:
                method:
                  type: string
                  const: jwt
                token:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - token
            - type: object
              properties:
                method:
                  type: string
                  const: oauth2
              required:
                - method
            - type: object
              properties:
                method:
                  type: string
                  const: certificate
                client_certificate:
                  type: string
                  minLength: 1
                client_key:
                  type: string
                  minLength: 1
                  x-marimohub-secret: true
              required:
                - method
                - client_certificate
                - client_key
            - type: object
              properties:
                method:
                  type: string
                  const: kerberos
                krb5_config:
                  type: string
                  minLength: 1
                service_name:
                  type: string
                  minLength: 1
                mutual_authentication:
                  default: required
                  type: string
                  enum:
                    - required
                    - optional
                    - disabled
                force_preemptive:
                  default: false
                  type: boolean
                hostname_override:
                  type: string
                  minLength: 1
                sanitize_mutual_error_response:
                  default: true
                  type: boolean
                principal:
                  type: string
                  minLength: 1
                delegate:
                  default: false
                  type: boolean
              required:
                - method
            - type: object
              properties:
                method:
                  type: string
                  const: gssapi
                krb5_config:
                  type: string
                  minLength: 1
                service_name:
                  type: string
                  minLength: 1
                mutual_authentication:
                  default: disabled
                  type: string
                  enum:
                    - required
                    - optional
                    - disabled
                force_preemptive:
                  default: false
                  type: boolean
                hostname_override:
                  type: string
                  minLength: 1
                sanitize_mutual_error_response:
                  default: true
                  type: boolean
                principal:
                  type: string
                  minLength: 1
                delegate:
                  default: false
                  type: boolean
              required:
                - method
        tls:
          default:
            verification: system
          oneOf:
            - type: object
              properties:
                verification:
                  type: string
                  const: system
              required:
                - verification
            - type: object
              properties:
                verification:
                  type: string
                  const: disabled
              required:
                - verification
            - type: object
              properties:
                verification:
                  type: string
                  const: custom_ca
                ca_bundle:
                  type: string
                  minLength: 1
              required:
                - verification
                - ca_bundle
        default_catalog:
          type: string
          pattern: ^[A-Za-z0-9_.-]+$
        default_schema:
          type: string
          pattern: ^[A-Za-z0-9_.-]+$
        source:
          type: string
          minLength: 1
        session_properties:
          default: {}
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        roles:
          default: {}
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: string
        client_tags:
          default: []
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                minLength: 1
            required:
              - value
        http_headers:
          default: []
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
              value:
                type: string
                minLength: 1
                x-marimohub-secret: true
            required:
              - name
              - value
        extra_credentials:
          default: []
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                pattern: ^[A-Za-z0-9_.-]+$
              value:
                type: string
                minLength: 1
                x-marimohub-secret: true
            required:
              - name
              - value
        timezone:
          type: string
          pattern: ^[A-Za-z0-9_+.-]+(?:\/[A-Za-z0-9_+.-]+)*$
        encoding:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              value:
                type: string
                enum:
                  - json
                  - json+lz4
                  - json+zstd
            required:
              - value
        max_attempts:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        request_timeout_seconds:
          type: number
          exclusiveMinimum: 0
        heartbeat_interval_seconds:
          type: number
          exclusiveMinimum: 0
        isolation_level:
          default: AUTOCOMMIT
          type: string
          enum:
            - AUTOCOMMIT
            - READ_UNCOMMITTED
            - READ_COMMITTED
            - REPEATABLE_READ
            - SERIALIZABLE
        legacy_primitive_types:
          default: false
          type: boolean
        legacy_prepared_statements:
          type: boolean
        ambient_env:
          default: false
          description: Also export TRINO_HOST, TRINO_PORT, TRINO_USER, TRINO_CATALOG, and
            TRINO_PASSWORD so marimo's data-source discovery offers this
            connection. Only one integration per session can claim them.
          type: boolean
      required:
        - host
        - auth
    wandb:
      type: object
      properties:
        api_key:
          type: string
          minLength: 1
          x-marimohub-secret: true
          description: API key from wandb.ai/authorize
        base_url:
          default: https://api.wandb.ai
          description: Set this for a self-hosted or dedicated-cloud deployment
          type: string
          pattern: ^https?:\/\/(?![^/?#]*@)[^\s?#]+$
        entity:
          description: Default team or user
          type: string
          pattern: ^[A-Za-z0-9._-]+$
        project:
          type: string
          pattern: ^[A-Za-z0-9._-]+$
        mode:
          default: online
          description: '`offline` records runs to disk without contacting the server'
          type: string
          enum:
            - online
            - offline
      required:
        - api_key
