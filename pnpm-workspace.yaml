packages:
  - packages/*
  - apps/*
  - examples/*

catalog:
  '@aws-sdk/client-s3': ^3.1066.0
  '@aws-sdk/client-secrets-manager': ^3.1066.0
  '@vitest/coverage-v8': 4.1.8
  '@cloudflare/sandbox': ^0.12.1
  '@cloudflare/workers-types': ^4.20260610.1
  '@hono/node-server': ^2.0.4
  '@hono/zod-openapi': ^1.2.2
  '@tailwindcss/vite': ^4.3.0
  '@tanstack/react-form': ^1.33.0
  '@tanstack/react-store': ^0.11.0
  '@testing-library/dom': ^10.4.1
  '@testing-library/jest-dom': ^6.9.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.1
  '@types/node': ^25.9.3
  better-all: ^0.0.7
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  concurrently: ^10.0.3
  hono: ^4.7.0
  jose: ^6.1.3
  jsdom: ^29.1.1
  lucide-react: ^1.17.0
  oauth4webapi: ^3.8.6
  ofetch: ^1.5.1
  openapi-fetch: ^0.17.0
  sonner: ^2.0.7
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.0
  tailwindcss-react-aria-components: ^2.1.1
  tw-animate-css: ^1.4.0
  typescript: ^6.0.3
  ulidx: ^2.4.1
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vite-plus: 0.1.24
  vitepress-plugin-llms: ^1.13.2
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
  yaml: ^2.8.0
  zod: ^4.3.6

catalogMode: prefer

# Never install a package version published in the last 14 days (20160 minutes).
# Guards against compromised/just-published releases and not-yet-shaken-out bugs.
# (pnpm strips these comments when it rewrites this file on `pnpm update`.)
minimumReleaseAge: 20160

# Exempt vitepress's bundled Algolia docs-search family — a build-only transitive
# we don't control that ships lockstep releases often fresher than the cooldown,
# which would otherwise wedge `pnpm install`.
minimumReleaseAgeExclude:
  - '@algolia/*'
  - algoliasearch
  - '@marimo-team/*'

overrides:
  vite: 'catalog:'
  vitepress>vite: ^5.4.0
  vitest: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
verifyDepsBeforeRun: install
blockExoticSubdeps: true
trustPolicy: no-downgrade
onlyBuiltDependencies: []
