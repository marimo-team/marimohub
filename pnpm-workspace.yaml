  # 0.2.x release; bumping vite-plus alone breaks `vp test`.
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vite-plus: 0.1.24
  vitepress-plugin-llms: ^1.13.2
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
  yaml: ^2.9.0
  zod: ^4.3.6

catalogMode: prefer

# Do not install a package version published in the last 14 days.
minimumReleaseAge: 20160

# Exempt the docs-search packages because they publish coordinated releases
# more often than the cooldown permits.
minimumReleaseAgeExclude:
  - '@algolia/*'
  - algoliasearch
  - '@marimo-team/*'
  # Exact-pinned prerelease of the CoreWeave Sandbox SDK (the only published
  # channel is beta, so every usable version is younger than the cooldown).
  - '@coreweave/cwsandbox@0.4.0-beta.0'
  # Security fixes take precedence over the release-age cooldown.
  - brace-expansion
  - nanoid
  - hono@4.12.34
  - ip-address@10.3.1
  - js-yaml@3.15.1
  - js-yaml@4.3.1
  - linkify-it@5.0.2
  - postcss
  - protobufjs@7.6.5
  - react-router@7.18.2
  - react-router-dom@7.18.2
  - shell-quote@1.9.0
  - tar
  - undici
  - vite@6.4.3

onlyBuiltDependencies: []

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

trustPolicy: no-downgrade
trustPolicyExclude:
  # Transitive of apache-arrow 17 (DuckDB-Wasm); this older release predates
  # the provenance carried by later undici-types releases.
  - undici-types@6.21.0
  # Transitive of React Doctor through Babel; this 2023 release predates npm
  # provenance for semver.
  - semver@6.3.1

verifyDepsBeforeRun: install
