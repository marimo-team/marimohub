packages:
  - packages/*
  - apps/*
  - examples/*

blockExoticSubdeps: true

catalog:
  '@aws-sdk/client-s3': ^3.1066.0
  '@aws-sdk/client-secrets-manager': ^3.1066.0
  '@azure/core-auth': ^1.11.0
  '@azure/identity': ^4.13.1
  '@azure/storage-blob': ^12.33.0
  '@cloudflare/sandbox': ^0.12.1
  '@cloudflare/workers-types': ^4.20260610.1
  '@hono/node-server': ^2.0.10
  '@hono/otel': ^1.1.2
  '@hono/zod-openapi': ^1.2.2
  '@opentelemetry/api': ^1.9.0
  '@opentelemetry/context-async-hooks': ^2.9.0
  '@opentelemetry/core': ^2.9.0
  '@opentelemetry/exporter-metrics-otlp-http': ^0.220.0
  '@opentelemetry/exporter-prometheus': ^0.220.0
  '@opentelemetry/exporter-trace-otlp-http': ^0.220.0
  '@opentelemetry/resources': ^2.9.0
  '@opentelemetry/sdk-metrics': ^2.9.0
  '@opentelemetry/sdk-trace-base': ^2.9.0
  '@opentelemetry/sdk-trace-node': ^2.9.0
  '@tailwindcss/vite': ^4.3.0
  '@tanstack/react-form': ^1.33.0
  '@tanstack/react-store': ^0.11.0
  '@testing-library/dom': ^10.4.1
  '@testing-library/jest-dom': ^6.9.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.1
  '@types/node': ^25.9.3
  '@vitest/coverage-v8': 4.1.8
  better-all: ^0.0.7
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  hono: ^4.12.34
  jose: ^6.1.3
  jsdom: ^29.1.1
  lucide-react: ^1.17.0
  modal: ^0.9.0
  oauth4webapi: ^3.8.6
  ofetch: ^1.5.1
  openapi-fetch: ^0.17.0
  simple-icons: ^16.27.0
  smol-toml: ^1.7.0
  sonner: ^2.0.7
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.0
  tailwindcss-react-aria-components: ^2.1.1
  tw-animate-css: ^1.4.0
  tsx: ^4.23.1
  typescript: ^6.0.3
  ulidx: ^2.4.1
  # Held at 0.1.24 to match @voidzero-dev/vite-plus-test (vitest), which has no
  # 0.2.x release; bumping vite-plus alone breaks `vp test`.
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vite-plus: 0.1.24
  vitepress-plugin-llms: ^1.13.2
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
  yaml: ^2.9.0
  zod: ^4.3.6

catalogMode: prefer

# Do not install a package version published in the last 14 days.
minimumReleaseAge: 20160

# Exempt the docs-search packages because they publish coordinated releases
# more often than the cooldown permits.
minimumReleaseAgeExclude:
  - '@algolia/*'
  - algoliasearch
  - '@marimo-team/*'
  # Security fixes take precedence over the release-age cooldown.
  - brace-expansion
  - nanoid
  - hono@4.12.34
  - ip-address@10.3.1
  - js-yaml@3.15.1
  - js-yaml@4.3.1
  - linkify-it@5.0.2
  - postcss
  - protobufjs@7.6.5
  - react-router@7.18.2
  - react-router-dom@7.18.2
  - shell-quote@1.9.0
  - tar
  - undici
  - vite@6.4.3

onlyBuiltDependencies: []

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

trustPolicy: no-downgrade

verifyDepsBeforeRun: install
