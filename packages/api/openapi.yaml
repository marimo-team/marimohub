            session and published by this change request.
          example: prop-7h2k9qm4xz7rp3w8
        change_request:
          type: object
          properties:
            provider:
              type: string
              minLength: 1
              example: github
            number:
              type: integer
              exclusiveMinimum: 0
              example: 42
            url:
              type: string
              format: uri
              example: https://github.com/acme/analytics/pull/42
            head_branch:
              type: string
              minLength: 1
              example: marimohub/nb-7h2k9qm4xz7rp3w8/prop-7h2k9qm4xz7rp3w8
            head_commit:
              type: string
              minLength: 1
              example: 9e107d9d372bb6826bd81d3542a419d6
          required:
            - provider
            - number
            - url
            - head_branch
            - head_commit
      required:
        - proposal_id
        - change_request
    OpenNotebookChangeRequestBody:
      type: object
