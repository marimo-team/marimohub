openapi: 3.1.0
info:
  title: marimohub API
  version: 1.0.0
  description: API for managing Marimo notebooks, projects, and sandboxes
tags:
  - name: Auth
    description: Authentication
  - name: Projects
    description: Project management
  - name: Alerts
    description: Project alert destinations
  - name: Notebooks
    description: Notebook CRUD and versioning
  - name: Sessions
    description: Notebook session lifecycle
  - name: Integrations
    description: Project and organization integrations
  - name: Secrets
    description: Project secret management
  - name: Users
    description: User identity resolution
  - name: Audit
    description: Deployment and project audit events
  - name: System
    description: Deployment metadata
security:
  - cookieAuth: []
  - bearerAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mh_session
      description: Session cookie minted by the OIDC login flow; browsers attach it
        automatically.
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal access token (`mhub_pat_…`) minted at POST
        /api/v1/me/tokens, for CI/CLI/service callers. Acts as the issuing user;
        cannot manage tokens.
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - PRECONDITION_FAILED
                - NOT_FOUND
                - CONFLICT
                - PROPOSAL_RETRY_REQUIRED
                - EDIT_SESSION_OWNED
                - EDIT_SESSION_CHANGED
                - TAKEOVER_IN_PROGRESS
                - FORBIDDEN
                - VALIDATION_ERROR
                - SYNC_NOT_CONFIGURED
                - NOT_INITIALIZED
                - SERVICE_UNAVAILABLE
                - PYTHON_ENV_SETUP_FAILED
                - RESOURCE_EXHAUSTED
                - SURFACE_NOT_ENABLED
                - SURFACE_UNAVAILABLE
                - SURFACE_FORBIDDEN
                - SURFACE_PRIMARY
                - SURFACE_UNSUPPORTED_PROVIDER
                - SURFACE_OPEN_INVALID
                - UNAUTHORIZED
                - USER_SUSPENDED
                - GONE
                - PAYLOAD_TOO_LARGE
                - NO_HTML_SNAPSHOT
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                required:
                  - field
                  - message
              description: Field-level validation failures.
            request_id:
              type: string
          required:
            - code
            - message
      required:
        - success
        - error
    Me:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type:
            - string
            - 'null'
        picture_url:
          type:
            - string
            - 'null'
          format: uri
        logout_url:
          type:
            - string
            - 'null'
        is_super_admin:
          type: boolean
        can_create_projects:
          type: boolean
      required:
        - id
        - email
        - logout_url
        - is_super_admin
        - can_create_projects
    DeploymentInfo:
      type: object
      properties:
        version:
          type: string
      required:
        - version
    Capabilities:
      type: object
      properties:
        federation:
          type: object
          properties:
            available:
              type: boolean
          required:
            - available
        integrations:
          type: object
          properties:
            available:
              type: boolean
          required:
            - available
        source_control:
          type: object
          properties:
            change_request_providers:
              type: array
              items:
                type: string
              description: Provider ids configured to publish pull requests, merge requests,
                or equivalents from notebook sessions.
              example:
                - github
            sync_providers:
              type: array
              items:
                type: string
              description: Provider ids configured for server-initiated pull sync (drift
                lookup and "Sync now").
              example:
                - github
            pull_source_providers:
              type: array
              items:
                type: string
              description: Provider ids configured to create pull-mode sources with
                server-materialized Git metadata.
              example:
                - github
          required:
            - change_request_providers
            - sync_providers
            - pull_source_providers
        project_alerts:
          type: object
          properties:
            available:
              type: boolean
            destination_types:
              type: array
              items:
                type: string
                enum:
                  - slack
                  - webhook
                  - unknown
                description: 'Known values: slack, webhook. Unrecognized values normalize to
                  unknown.'
                example: slack
            selectable_kinds:
              type: array
              items:
                type: string
                enum:
                  - member.invited
                  - member.added
                  - member.role_changed
                  - member.removed
                  - session.takeover
                  - notebook.deleted
                  - project.deleted
                  - app.start_failed
                  - app.unavailable
                  - sync.failed
                  - unknown
                description: 'Known values: member.invited, member.added, member.role_changed,
                  member.removed, session.takeover, notebook.deleted,
                  project.deleted, app.start_failed, app.unavailable,
                  sync.failed. Unrecognized values normalize to unknown.'
                example: member.invited
            max_destinations:
              type: integer
              exclusiveMinimum: 0
          required:
            - available
            - destination_types
            - selectable_kinds
            - max_destinations
        data_browser:
          type: object
          properties:
            available:
              type: boolean
            preview:
              type: boolean
            query:
              type: boolean
            ai_query:
              type: boolean
          required:
            - available
            - preview
            - query
            - ai_query
        viewer_mode:
          type: string
          enum:
            - static
            - applications
            - ephemeral-sandbox
        viewer_session_modes:
          type: array
          items:
            type: string
            enum:
              - edit
              - app
        editor_sandbox_sharing:
          type: string
          enum:
            - shared
            - exclusive
        default_role:
          type:
            - string
            - 'null'
          enum:
            - manager
            - editor
            - viewer
            - null
        limits:
          type: object
          properties:
            max_concurrent_sessions_per_user:
              type:
                - number
                - 'null'
            max_apps_per_project:
              type:
                - number
                - 'null'
            max_request_bytes:
              type: number
            max_versions_per_notebook:
              type: number
            default_page_size:
              type: number
            max_page_size:
              type: number
          required:
            - max_concurrent_sessions_per_user
            - max_apps_per_project
            - max_request_bytes
            - max_versions_per_notebook
            - default_page_size
            - max_page_size
        sandbox_images:
          type: array
          items:
            type: string
        sandbox_startup_timeout_seconds:
          type: number
        compute_profiles:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ComputeResources'
              - type: object
                properties:
                  name:
                    type: string
                required:
                  - name
        compute_profile_override:
          type: string
          enum:
            - none
            - editors
        surfaces:
          type: array
          items:
            oneOf:
              - type: object
                properties:
                  id:
                    type: string
                    enum:
                      - vscode
                  flavor:
                    type: string
                    enum:
                      - code-server
                      - openvscode
                  start:
                    type: string
                    enum:
                      - on-demand
                      - eager
                  embed:
                    type: string
                    enum:
                      - tab
                      - iframe
                required:
                  - id
                  - flavor
                  - start
                  - embed
              - type: object
                properties:
                  id:
                    type: string
                    enum:
                      - opencode
                  start:
                    type: string
                    enum:
                      - on-demand
                      - eager
                  embed:
                    type: string
                    enum:
                      - tab
                      - iframe
                  managed_ai:
                    type: boolean
                required:
                  - id
                  - start
                  - embed
                  - managed_ai
      required:
        - federation
        - integrations
        - source_control
        - project_alerts
        - data_browser
        - viewer_mode
        - viewer_session_modes
        - editor_sandbox_sharing
        - default_role
        - limits
        - sandbox_images
        - sandbox_startup_timeout_seconds
        - compute_profiles
        - compute_profile_override
        - surfaces
    ComputeResources:
      type: object
      properties:
        cpu:
          type: number
        memory_bytes:
          type: number
        gpu:
          type: string
    ProjectPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotProjectEntry'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
    SnapshotProjectEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        owner:
          type: string
        status:
          type: string
          enum:
            - active
            - deleted
        created_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        notebook_count:
          type: number
      required:
        - id
        - name
        - description
        - owner
        - status
        - created_at
        - updated_at
        - notebook_count
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        owner:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
        status:
          type: string
          enum:
            - active
            - deleted
        created_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        tags:
          type: array
          items:
            type: string
        federation:
          $ref: '#/components/schemas/ProjectFederation'
        security_labels:
          $ref: '#/components/schemas/SecurityLabels'
        your_role:
          type:
            - string
            - 'null'
          enum:
            - admin
            - manager
            - editor
            - viewer
            - null
      required:
        - id
        - name
        - description
        - owner
        - members
        - status
        - created_at
        - updated_at
        - tags
        - your_role
    ProjectMember:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - admin
            - manager
            - editor
            - viewer
      required:
        - role
    ProjectFederation:
      type: object
      properties:
        enabled:
          type: boolean
        target:
          type: string
      required:
        - enabled
    SecurityLabels:
      type: object
      properties:
        classification:
          type: string
        compartments:
          type: array
          items:
            type: string
      required:
        - classification
        - compartments
    ProjectFederationInput:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
        target:
          type: string
          example: default
      required:
        - enabled
    SecurityLabelsInput:
      type: object
      properties:
        classification:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,63}$
        compartments:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,63}$
          maxItems: 64
      required:
        - classification
        - compartments
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
      required:
        - success
    AssignableRole:
      type: string
      enum:
        - manager
        - editor
        - viewer
      example: editor
    ProjectAlertDestinationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAlertDestination'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
    ProjectAlertDestination:
      oneOf:
        - type: object
          properties:
            id:
              type: string
              pattern: ^alert-[0-9a-z]{16}$
            name:
              type: string
            kinds:
              type: array
              items:
                type: string
                enum: &a1
                  - member.invited
                  - member.added
                  - member.role_changed
                  - member.removed
                  - session.takeover
                  - notebook.deleted
                  - project.deleted
                  - app.start_failed
                  - app.unavailable
                  - sync.failed
                  - unknown
                description: 'Known values: member.invited, member.added, member.role_changed,
                  member.removed, session.takeover, notebook.deleted,
                  project.deleted, app.start_failed, app.unavailable,
                  sync.failed. Unrecognized values normalize to unknown.'
                example: member.invited
            enabled:
              type: boolean
            verified_at:
              type:
                - string
                - 'null'
              format: date-time
            endpoint_host:
              type: string
            created_by:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            type:
              type: string
              enum:
                - slack
            webhook_url_set:
              type: boolean
              enum:
                - true
          required:
            - id
            - name
            - kinds
            - enabled
            - verified_at
            - endpoint_host
            - created_by
            - created_at
            - updated_at
            - type
            - webhook_url_set
        - type: object
          properties:
            id:
              type: string
              pattern: ^alert-[0-9a-z]{16}$
            name:
              type: string
            kinds:
              type: array
              items:
                type: string
                enum: *a1
                description: 'Known values: member.invited, member.added, member.role_changed,
                  member.removed, session.takeover, notebook.deleted,
                  project.deleted, app.start_failed, app.unavailable,
                  sync.failed. Unrecognized values normalize to unknown.'
                example: member.invited
            enabled:
              type: boolean
            verified_at:
              type:
                - string
                - 'null'
              format: date-time
            endpoint_host:
              type: string
            created_by:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            type:
              type: string
              enum:
                - webhook
            url_set:
              type: boolean
              enum:
                - true
            signing_secret_set:
              type: boolean
              enum:
                - true
          required:
            - id
            - name
            - kinds
            - enabled
            - verified_at
            - endpoint_host
            - created_by
            - created_at
            - updated_at
            - type
            - url_set
            - signing_secret_set
    AuditLogPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
        schema_version:
          type: integer
          exclusiveMinimum: 0
        ts:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        event:
          type: string
          example: project.update
        actor:
          type: string
        metadata:
          type: object
          additionalProperties: {}
      required:
        - id
        - schema_version
        - ts
        - event
        - actor
        - metadata
    AuditEvent:
      type: object
      properties:
        ts:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        event:
          type: string
          example: project.update
        actor:
          type: string
      required:
        - ts
        - event
        - actor
      additionalProperties: {}
    AdminUserPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        updated_at:
          type: string
          format: date-time
        suspended_at:
          type:
            - string
            - 'null'
          format: date-time
        is_super_admin:
          type: boolean
      required:
        - id
        - email
        - name
        - updated_at
        - suspended_at
        - is_super_admin
    SandboxStartupReport:
      type: object
      properties:
        ok:
          type: boolean
        sandbox_id:
          type: string
        image:
          type:
            - string
            - 'null'
        compute_profile:
          type:
            - string
            - 'null'
        compute_resources:
          $ref: '#/components/schemas/ComputeResources'
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        total_ms:
          type: number
          minimum: 0
        handle:
          $ref: '#/components/schemas/SandboxStartupPhase'
        readiness:
          $ref: '#/components/schemas/SandboxStartupCommand'
        exec:
          $ref: '#/components/schemas/SandboxStartupCommand'
        cleanup:
          $ref: '#/components/schemas/SandboxStartupPhase'
        startup_timings_ms:
          type: object
          additionalProperties:
            type: number
            minimum: 0
        counters:
          type: object
          additionalProperties:
            type: number
        environment_setup_benchmark:
          $ref: '#/components/schemas/SandboxEnvironmentSetupBenchmark'
      required:
        - ok
        - sandbox_id
        - image
        - compute_profile
        - compute_resources
        - started_at
        - finished_at
        - total_ms
        - handle
        - readiness
        - exec
        - cleanup
        - startup_timings_ms
        - counters
        - environment_setup_benchmark
    SandboxStartupPhase:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - failed
            - skipped
            - unknown
          description: 'Known values: ok, failed, skipped. Unrecognized values normalize
            to unknown.'
          example: ok
        duration_ms:
          type:
            - number
            - 'null'
          minimum: 0
        error:
          type: object
          additionalProperties: {}
      required:
        - status
        - duration_ms
    SandboxStartupCommand:
      allOf:
        - $ref: '#/components/schemas/SandboxStartupPhase'
        - type: object
          properties:
            command:
              type: string
              example: echo "Hello"
            stdout:
              type: string
            stderr:
              type: string
            failure_code:
              type: string
              enum:
                - COMMAND_FAILED
                - SPAWN_FAILED
                - BACKEND_ERROR
                - unknown
              description: 'Known values: COMMAND_FAILED, SPAWN_FAILED, BACKEND_ERROR.
                Unrecognized values normalize to unknown.'
              example: COMMAND_FAILED
          required:
            - command
            - stdout
            - stderr
    SandboxEnvironmentSetupBenchmark:
      type:
        - object
        - 'null'
      properties:
        tool:
          type: string
          minLength: 1
          example: uv
        runtime_probe:
          $ref: '#/components/schemas/SandboxStartupCommand'
        artifact_download:
          $ref: '#/components/schemas/SandboxStartupCommand'
        prepare:
          $ref: '#/components/schemas/SandboxStartupCommand'
        install:
          $ref: '#/components/schemas/SandboxStartupCommand'
      required:
        - tool
        - runtime_probe
        - artifact_download
        - prepare
        - install
      description: The optional fixed-package benchmark, or null when it was not requested
    SandboxStartupRequest:
      type: object
      properties:
        image:
          type: string
          minLength: 1
        compute_profile:
          type: string
          minLength: 1
        environment_setup_benchmark:
          type: boolean
          description: Run the fixed-package uv, wheel-download, runtime, and
            CPU-throttling benchmark
      additionalProperties: false
    DeploymentConfig:
      type: object
      properties:
        deployment:
          $ref: '#/components/schemas/AdminDeployment'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ConfigGroup'
        policy:
          $ref: '#/components/schemas/AdminPolicy'
      required:
        - deployment
        - groups
        - policy
    AdminDeployment:
      type:
        - object
        - 'null'
      properties:
        version:
          type: string
        image:
          type:
            - string
            - 'null'
        sandbox_image:
          type:
            - string
            - 'null'
        started_at:
          type:
            - string
            - 'null'
        replica:
          type:
            - string
            - 'null'
        node:
          type:
            - string
            - 'null'
        backends:
          type:
            - object
            - 'null'
          properties:
            storage:
              type: string
            compute:
              type: string
            auth:
              type: string
          required:
            - storage
            - compute
            - auth
      required:
        - version
        - image
        - sandbox_image
        - started_at
        - replica
        - node
        - backends
    ConfigGroup:
      type: object
      properties:
        name:
          type: string
        backend:
          type:
            - string
            - 'null'
        settings:
          type: array
          items:
            $ref: '#/components/schemas/ConfigSetting'
      required:
        - name
        - backend
        - settings
    ConfigSetting:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        value:
          type:
            - string
            - 'null'
        secret:
          type: boolean
        set:
          type: boolean
      required:
        - key
        - name
        - value
        - secret
        - set
    AdminPolicy:
      type: object
      properties:
        default_role:
          type:
            - string
            - 'null'
          enum:
            - manager
            - editor
            - viewer
            - null
        super_admins:
          type: array
          items:
            type: string
      required:
        - default_role
        - super_admins
    PolicyAnalyzerMetadata:
      type: object
      properties:
        schema_version:
          type: number
          enum:
            - 1
        max_cases:
          type: integer
          exclusiveMinimum: 0
        capabilities:
          type: object
          properties:
            login_policy:
              type: boolean
            resource_security:
              type: boolean
            live_self_context:
              type: boolean
          required:
            - login_policy
            - resource_security
            - live_self_context
          additionalProperties: false
        entitlements:
          type: array
          items:
            type: string
            enum:
              - super-admin
              - project-creator
              - default-role:viewer
              - default-role:editor
              - default-role:manager
        classification_order:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            type: object
            properties:
              action:
                type: string
                enum:
                  - project.create
                  - admin.access
                  - org-integration.manage
                  - audit.global.read
                  - directory.search
                  - project.read
                  - project.update
                  - project.delete
                  - project.members.manage
                  - project.events.read
                  - project.alerts.manage
                  - notebook.write
                  - notebook.manage
                  - integration.read
                  - integration.use
                  - integration.manage
                  - change-request.publish
                  - security-labels.raise
                  - security-labels.lower
                  - session.attach
                  - session.stop
                  - session.surface
                  - session.proxy
                  - session.start
              scope:
                type: string
                enum:
                  - deployment
                  - project
                  - session
                  - session-start
              minimum_role:
                type:
                  - string
                  - 'null'
                enum:
                  - viewer
                  - editor
                  - manager
                  - admin
                  - null
              denied_as:
                type:
                  - string
                  - 'null'
                enum:
                  - not-found
                  - forbidden
                  - null
