  /api/v1/me/cli-authorizations:
    post:
      operationId: auth.cli.approve
      x-cli-hidden: true
      tags:
        - Auth
      summary: Approve a CLI login
      description: Creates a short-lived, one-time authorization code bound to the CLI
        PKCE challenge. Requires a browser session; the personal access token is
        minted only during exchange.
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callback_uri:
                  type: string
                  maxLength: 300
                  format: uri
                  description: HTTP loopback callback using 127.0.0.1 or [::1], an explicit port,
                    and the exact /callback path.
                  example: http://127.0.0.1:49152/callback
                state:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{32,128}$
                  description: Opaque base64url CSRF state generated by the CLI.
                code_challenge:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
                  description: Base64url-encoded SHA-256 PKCE challenge generated by the CLI.
                token_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Name shown in the user's personal access token list.
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 3650
                  description: Lifetime of the personal access token minted during exchange.
              required:
                - callback_uri
                - state
                - code_challenge
                - token_name
                - expires_in_days
      responses:
        '201':
          description: Loopback callback carrying the one-time authorization code
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      redirect_uri:
                        type: string
                        format: uri
                      expires_at:
                        type: string
                        format: date-time
                    required:
                      - redirect_uri
                      - expires_at
                required:
                  - success
                  - data
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
