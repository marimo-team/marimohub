          required: true
          name: pid
          in: path
        - schema:
            type: string
            pattern: ^intg-[0-9a-z]{16}$
            example: intg-7h2k9qm4xz7rp3w8
          required: true
          name: iid
          in: path
        - schema:
            type: string
            minLength: 1
            maxLength: 255
            example: analytics-lake
          required: true
          name: bucket
          in: query
        - schema:
            type: string
            minLength: 1
            example: events/2026/part-001.jsonl
          required: true
          name: key
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 2048
