  /api/v1/users:
    get:
      tags:
        - Users
      summary: Resolve user ids to display identities
      description: Batch-resolve opaque user ids (the auth `sub` stored as a notebook
        `author` or session `user_id`) into `{ id, email, name }`. Ids with no
        recorded identity are omitted from the result map.
      parameters:
        - schema:
            type: string
            description: Comma-separated user ids.
            example: user,sub-abc123
          required: false
          description: Comma-separated user ids.
          name: ids
          in: query
      responses:
        '200':
          description: Map of user id → resolved identity (unknown ids omitted)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/User'
                required:
                  - success
                  - data
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/tokens:
    post:
      tags:
        - Auth
      summary: Create a personal access token
      description: 'Mint a machine credential that acts as the calling user (CI,
        scripts, the CLI): send it as `Authorization: Bearer mhub_pat_…`. The
        plaintext token is returned once, in this response, and never again.
        Requires session (SSO) auth — a token cannot mint tokens.'
      security: &a1
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: ci-deploy
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 3650
                  description: Days until expiry; omit for a non-expiring token.
                  example: 90
              required:
                - name
      responses:
        '201':
          description: The new token — copy it now; it is never shown again
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/ApiTokenCreated'
                required:
                  - success
                  - data
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Resource limit reached
          headers:
            Retry-After:
              schema:
                type: string
                description: Seconds to wait before retrying.
                example: '5'
              required: true
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service unavailable
          headers:
            Retry-After:
              schema:
                type: string
                description: Seconds to wait before retrying.
                example: '5'
              required: true
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Auth
      summary: List the caller's personal access tokens
      description: Metadata only — the secret is never retrievable after creation.
      security: *a1
