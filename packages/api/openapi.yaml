openapi: 3.1.0
info:
  title: marimohub API
  version: 1.0.0
  description: API for managing Marimo notebooks, projects, and sandboxes
tags:
  - name: Auth
    description: Authentication
  - name: Projects
    description: Project management
  - name: Notebooks
    description: Notebook CRUD and versioning
  - name: Sessions
    description: Notebook session lifecycle
  - name: Users
    description: User identity resolution
  - name: System
    description: Deployment metadata
security:
  - cookieAuth: []
  - bearerAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mh_session
      description: Session cookie minted by the OIDC login flow; browsers attach it
        automatically.
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal access token (`mhub_pat_…`) minted at POST
        /api/v1/me/tokens, for CI/CLI/service callers. Acts as the issuing user;
        cannot manage tokens.
  schemas:
    Me:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        logout_url:
          type:
            - string
            - 'null'
        is_super_admin:
          type: boolean
      required:
        - id
        - email
        - logout_url
        - is_super_admin
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - GONE
                - PRECONDITION_FAILED
                - PAYLOAD_TOO_LARGE
                - VALIDATION_ERROR
                - RESOURCE_EXHAUSTED
                - NOT_INITIALIZED
                - NO_HTML_SNAPSHOT
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
            message:
              type: string
            request_id:
              type: string
          required:
            - code
            - message
      required:
        - success
        - error
    DeploymentInfo:
      type: object
      properties:
        version:
          type: string
        image:
          type:
            - string
            - 'null'
        sandbox_image:
          type:
            - string
            - 'null'
        started_at:
          type:
            - string
            - 'null'
        replica:
          type:
            - string
            - 'null'
        node:
          type:
            - string
            - 'null'
        backends:
          type: object
          properties:
            storage:
              type: string
            compute:
              type: string
            auth:
              type: string
          required:
            - storage
            - compute
            - auth
      required:
        - version
        - image
        - sandbox_image
        - started_at
        - replica
        - node
        - backends
    Capabilities:
      type: object
      properties:
        federation:
          type: object
          properties:
            available:
              type: boolean
          required:
            - available
        integrations:
          type: object
          properties:
            available:
              type: boolean
          required:
            - available
        viewer_mode:
          type: string
          enum:
            - static
            - applications
            - ephemeral-sandbox
        viewer_session_modes:
          type: array
          items:
            type: string
            enum:
              - edit
              - app
        default_role:
          type:
            - string
            - 'null'
          enum:
            - admin
            - editor
            - viewer
            - null
        limits:
          type: object
          properties:
            max_concurrent_sessions_per_user:
              type:
                - number
                - 'null'
            max_apps_per_project:
              type:
                - number
                - 'null'
            max_request_bytes:
              type: number
            max_versions_per_notebook:
              type: number
            default_page_size:
              type: number
            max_page_size:
              type: number
          required:
            - max_concurrent_sessions_per_user
            - max_apps_per_project
            - max_request_bytes
            - max_versions_per_notebook
            - default_page_size
            - max_page_size
        sandbox_images:
          type: array
          items:
            type: string
        compute_profiles:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ComputeResources'
              - type: object
                properties:
                  name:
                    type: string
                required:
                  - name
        compute_profile_override:
          type: string
          enum:
            - none
            - editors
      required:
        - federation
        - integrations
        - viewer_mode
        - viewer_session_modes
        - default_role
        - limits
        - sandbox_images
        - compute_profiles
        - compute_profile_override
    ComputeResources:
      type: object
      properties:
        cpu:
          type: number
        memory_bytes:
          type: number
    ProjectPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotProjectEntry'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
    SnapshotProjectEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        owner:
          type: string
        status:
          type: string
          enum:
            - active
            - deleted
        created_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        notebook_count:
          type: number
      required:
        - id
        - name
        - description
        - owner
        - status
        - created_at
        - updated_at
        - notebook_count
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        owner:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
        status:
          type: string
          enum:
            - active
            - deleted
        created_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        tags:
          type: array
          items:
            type: string
        federation:
          $ref: '#/components/schemas/ProjectFederation'
        your_role:
          type:
            - string
            - 'null'
          enum:
            - admin
            - editor
            - viewer
            - null
      required:
        - id
        - name
        - description
        - owner
        - members
        - status
        - created_at
        - updated_at
        - tags
        - your_role
    ProjectMember:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - admin
            - editor
            - viewer
      required:
        - role
    ProjectFederation:
      type: object
      properties:
        enabled:
          type: boolean
        target:
          type: string
      required:
        - enabled
    ProjectFederationInput:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
        target:
          type: string
          example: default
      required:
        - enabled
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
      required:
        - success
    AuditEvent:
      type: object
      properties:
        ts:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        event:
          type: string
          example: project.update
        actor:
          type: string
      required:
        - ts
        - event
        - actor
      additionalProperties: {}
    NotebookPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotNotebookEntry'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
    SnapshotNotebookEntry:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - draft
            - active
            - archived
            - deleted
        source_type:
          type: string
          enum:
            - local
            - git
        author:
          type: string
        created_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        tags:
          type: array
          items:
            type: string
        last_run_at:
          type:
            - string
            - 'null'
          format: date-time
          example: 2025-03-05T14:00:00Z
        compute_profile:
          type: string
      required:
        - id
        - title
        - description
        - status
        - source_type
        - author
        - created_at
        - updated_at
        - tags
        - last_run_at
    NotebookMeta:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - draft
            - active
            - archived
            - deleted
        author:
          type: string
        created_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        last_run_at:
          type:
            - string
            - 'null'
          format: date-time
          example: 2025-03-05T14:00:00Z
        tags:
          type: array
          items:
            type: string
        runtime:
          type: object
          properties:
            python_version:
              type: string
            marimo_version:
              type: string
        base_image:
          type: string
        compute_profile:
          type: string
      required:
        - id
        - project_id
        - title
        - description
        - status
        - author
        - created_at
        - updated_at
        - last_run_at
        - tags
    GitNotebookCreateResult:
      type: object
      properties:
        notebook:
          $ref: '#/components/schemas/NotebookMeta'
        sync_url:
          type: string
        sync_token:
          type: string
      required:
        - notebook
        - sync_url
        - sync_token
    SyncToken:
      type: object
      properties:
        sync_url:
          type: string
        sync_token:
          type: string
      required:
        - sync_url
        - sync_token
    GitSourceConfig:
      type: object
      properties:
        repo:
          type: string
        branch:
          type: string
        root_path:
          type: string
        entry_notebook:
          type: string
      required:
        - repo
        - branch
        - root_path
        - entry_notebook
    NotebookDetail:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/NotebookMeta'
        readme:
          type:
            - string
            - 'null'
        source:
          $ref: '#/components/schemas/Source'
      required:
        - meta
        - readme
        - source
    Source:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - local
            current_version_id:
              type: string
          required:
            - type
            - current_version_id
        - type: object
          properties:
            type:
              type: string
              enum:
                - git
            provider:
              type: string
              enum:
                - github
            repo:
              type: string
            branch:
              type: string
            root_path:
              type: string
            entry_notebook:
              type: string
            pending_config:
              $ref: '#/components/schemas/GitSourceConfig'
            sync_mode:
              type: string
              enum:
                - push
            current_version_id:
              type:
                - string
                - 'null'
            commit:
              type:
                - string
                - 'null'
            last_synced_at:
              type:
                - string
                - 'null'
              format: date-time
              example: 2025-03-05T14:00:00Z
          required:
            - type
            - provider
            - repo
            - branch
            - root_path
            - entry_notebook
            - sync_mode
            - current_version_id
            - commit
            - last_synced_at
    NotebookVersionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotebookVersion'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
    NotebookVersion:
      type: object
      properties:
        version_id:
          type: string
        notebook_id:
          type: string
        saved_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        author:
          type: string
        message:
          type: string
        parent_id:
          type:
            - string
            - 'null'
        html_snapshot:
          $ref: '#/components/schemas/SnapshotDescriptor'
        session_snapshot:
          $ref: '#/components/schemas/SnapshotDescriptor'
        commit:
          type: string
      required:
        - version_id
        - notebook_id
        - saved_at
        - author
        - message
        - parent_id
    SnapshotDescriptor:
      type: object
      properties:
        captured_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        size_bytes:
          type: number
      required:
        - captured_at
        - size_bytes
    SessionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
    Session:
      type: object
      properties:
        session_id:
          type: string
        notebook_id:
          type: string
        project_id:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum:
            - starting
            - running
            - terminating
            - terminated
            - failed
            - expired
        sandbox_url:
          type: string
        started_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        last_heartbeat:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        ephemeral:
          type: boolean
        mode:
          type: string
          enum:
            - edit
            - app
        source_version_id:
          type: string
        can:
          type: object
          properties:
            attach:
              type: boolean
            stop:
              type: boolean
          required:
            - attach
            - stop
        active_connections:
          type: number
        connections_checked_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        compute_profile:
          type: string
        compute_resources:
          $ref: '#/components/schemas/ComputeResources'
        compute_from_snapshot:
          type: boolean
        integrations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              kind:
                type: string
              version:
                type: integer
            required:
              - id
              - name
              - kind
              - version
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      required:
        - session_id
        - notebook_id
        - project_id
        - user_id
        - status
        - started_at
        - last_heartbeat
        - mode
        - can
    SessionCreateResult:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          properties:
            reused:
              type: boolean
          required:
            - reused
    SessionCreateBody:
      type: object
      properties:
        mode:
          type: string
          enum:
            - edit
            - app
        compute_profile:
          type: string
          enum:
            - default
    SecretEntry:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
            - managed
            - reference
        ref:
          type: object
          properties:
            backend:
              type: string
              example: aws-sm
            locator:
              type: string
              example: prod/ai#OPENAI_API_KEY
            expand:
              type: string
              enum:
                - json
            prefix:
              type: string
          required:
            - backend
            - locator
        created_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - name
        - kind
        - created_by
        - created_at
        - updated_at
    SecretInput:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - managed
            value:
              type: string
              minLength: 1
          required:
            - kind
            - value
        - type: object
          properties:
            kind:
              type: string
              enum:
                - reference
            backend:
              type: string
              minLength: 1
              example: aws-sm
            locator:
              type: string
              minLength: 1
              example: prod/ai#OPENAI_API_KEY
            expand:
              type: string
              enum:
                - json
            prefix:
              type: string
          required:
            - kind
            - backend
            - locator
    SecretValidateResult:
      type: object
      properties:
        ok:
          type: boolean
        reason:
          type: string
      required:
        - ok
    IntegrationKind:
      type: object
      properties:
        kind:
          type: string
          example: postgres
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum:
            - database
            - catalog
            - engine
            - storage
            - other
        schema_version:
          type: integer
        json_schema:
          type: object
          additionalProperties: {}
        ui_hints:
          type: object
          additionalProperties:
            type: object
            properties:
              widget:
                type: string
                enum:
                  - text
                  - password
                  - textarea
                  - select
                  - toggle
                  - number
                  - kv-pairs
              placeholder:
                type: string
              group:
                type: string
              order:
                type: number
              advanced:
                type: boolean
              docs_url:
                type: string
        supports_test:
          type: boolean
        requirements:
          type: array
          items:
            type: string
      required:
        - kind
        - title
        - description
        - category
        - schema_version
        - json_schema
        - ui_hints
        - supports_test
        - requirements
    IntegrationEntry:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        current_version:
          type: integer
        created_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        scope:
          type: string
          enum:
            - project
            - org
        shadowed:
          type: boolean
      required:
        - id
        - kind
        - name
        - enabled
        - current_version
        - created_by
        - created_at
        - updated_at
    IntegrationDetail:
      allOf:
        - $ref: '#/components/schemas/IntegrationEntry'
        - type: object
          properties:
            config:
              type: object
              additionalProperties: {}
            change_note:
              type: string
          required:
            - config
    IntegrationVersionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationVersion'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
    IntegrationVersion:
      type: object
      properties:
        version:
          type: integer
        kind_schema_version:
          type: integer
        created_by:
          type: string
        created_at:
          type: string
        change_note:
          type: string
      required:
        - version
        - kind_schema_version
        - created_by
        - created_at
    IntegrationImportRequest:
      type: object
      properties:
        source_project_id:
          type: string
          pattern: ^proj-[0-9a-z]{16}$
          example: proj-7h2k9qm4xz7rp3w8
        source_integration_id:
          type: string
          pattern: ^intg-[0-9a-z]{16}$
          example: intg-7h2k9qm4xz7rp3w8
        name:
          type: string
          minLength: 1
      required:
        - source_project_id
        - source_integration_id
    IntegrationTestResult:
      type: object
      properties:
        ok:
          type: boolean
        latency_ms:
          type: number
        details:
          type: string
      required:
        - ok
    IntegrationTestRequest:
      anyOf:
        - type: object
          properties:
            kind:
              type: string
              minLength: 1
            config:
              type: object
              additionalProperties: {}
          required:
            - kind
            - config
        - type: object
          properties:
            id:
              type: string
              pattern: ^intg-[0-9a-z]{16}$
          required:
            - id
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
      required:
        - id
        - email
        - name
    ApiTokenCreated:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          properties:
            token:
              type: string
          required:
            - token
    ApiToken:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - created_at
  parameters: {}
paths:
  /api/v1/me:
    get:
      tags:
        - Auth
      summary: Get current user info
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Me'
                required:
                  - success
                  - data
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/version:
    get:
      tags:
        - System
      summary: Get deployment version info
      responses:
        '200':
          description: Deployment version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/DeploymentInfo'
                required:
                  - success
                  - data
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/capabilities:
    get:
      tags:
        - System
      summary: Get deployment capability flags
      responses:
        '200':
          description: Deployment capability flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Capabilities'
                required:
                  - success
                  - data
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/projects:
    get:
      tags:
        - Projects
      summary: List all projects
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            example: 100
          required: false
          name: limit
          in: query
        - schema:
            type: string
