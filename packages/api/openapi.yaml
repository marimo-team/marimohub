openapi: 3.1.0
info:
  title: MarimoHub API
  version: 1.0.0
  description: API for managing Marimo notebooks, projects, and sandboxes
tags:
  - name: Auth
    description: Authentication
  - name: Projects
    description: Project management
  - name: Notebooks
    description: Notebook CRUD and versioning
  - name: Sessions
    description: Notebook session lifecycle
components:
  schemas:
    SnapshotProjectEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        owner:
          type: string
        created_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        notebook_count:
          type: number
        notebooks:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotNotebookEntry'
      required:
        - id
        - name
        - description
        - owner
        - created_at
        - updated_at
        - notebook_count
        - notebooks
    SnapshotNotebookEntry:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - draft
            - active
            - archived
            - deleted
        source_type:
          type: string
          enum:
            - local
            - github
        author:
          type: string
        created_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        tags:
          type: array
          items:
            type: string
        last_run_at:
          type:
            - string
            - 'null'
      required:
        - id
        - title
        - description
        - status
        - source_type
        - author
        - created_at
        - updated_at
        - tags
        - last_run_at
    Project:
      type: object
      properties:
        schema_version:
          type: number
          enum:
            - 1
        id:
          type: string
        name:
          type: string
        description:
          type: string
        owner:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
        created_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        tags:
          type: array
          items:
            type: string
      required:
        - schema_version
        - id
        - name
        - description
        - owner
        - members
        - created_at
        - updated_at
        - tags
    ProjectMember:
      type: object
      properties:
        user_id:
          type: string
        role:
          type: string
          enum:
            - admin
            - editor
            - viewer
      required:
        - user_id
        - role
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      required:
        - success
        - error
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
      required:
        - success
    NotebookMeta:
      type: object
      properties:
        schema_version:
          type: number
          enum:
            - 1
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - draft
            - active
            - archived
            - deleted
        author:
          type: string
        created_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        last_run_at:
          type:
            - string
            - 'null'
        tags:
          type: array
          items:
            type: string
        runtime:
          type: object
          properties:
            python_version:
              type: string
            marimo_version:
              type: string
      required:
        - schema_version
        - id
        - project_id
        - title
        - description
        - status
        - author
        - created_at
        - updated_at
        - last_run_at
        - tags
    NotebookDetail:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/NotebookMeta'
        readme:
          type:
            - string
            - 'null'
        source:
          $ref: '#/components/schemas/Source'
      required:
        - meta
        - readme
        - source
    Source:
      oneOf:
        - type: object
          properties:
            schema_version:
              type: number
              enum:
                - 1
            type:
              type: string
              enum:
                - local
            current_version_id:
              type: string
          required:
            - schema_version
            - type
            - current_version_id
        - type: object
          properties:
            schema_version:
              type: number
              enum:
                - 1
            type:
              type: string
              enum:
                - github
            repo:
              type: string
            branch:
              type: string
            path:
              type: string
            commit:
              type: string
            last_synced_at:
              type: string
              format: date-time
              example: 2025-03-05T14:00:00Z
          required:
            - schema_version
            - type
            - repo
            - branch
            - path
            - commit
            - last_synced_at
    Version:
      type: object
      properties:
        schema_version:
          type: number
          enum:
            - 1
        version_id:
          type: string
        notebook_id:
          type: string
        saved_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        author:
          type: string
        message:
          type: string
        parent_id:
          type:
            - string
            - 'null'
      required:
        - schema_version
        - version_id
        - notebook_id
        - saved_at
        - author
        - message
        - parent_id
    Session:
      type: object
      properties:
        session_id:
          type: string
        notebook_id:
          type: string
        project_id:
          type: string
        status:
          type: string
          enum:
            - starting
            - running
            - idle
            - terminated
            - expired
        sandbox_url:
          type: string
        started_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        last_heartbeat:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
      required:
        - session_id
        - notebook_id
        - project_id
        - status
        - started_at
        - last_heartbeat
  parameters: {}
paths:
  /api/me:
    get:
      tags:
        - Auth
      summary: Get current user info
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      logoutUrl:
                        type:
                          - string
                          - 'null'
                    required:
                      - id
                      - email
                      - logoutUrl
                required:
                  - success
                  - data
  /api/projects:
    get:
      tags:
        - Projects
      summary: List all projects
      responses:
        '200':
          description: List of projects with notebook summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SnapshotProjectEntry'
                required:
                  - success
                  - data
    post:
      tags:
        - Projects
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  example: Data Science
                description:
                  type: string
                  example: Exploratory analysis notebooks
                tags:
                  type: array
                  items:
                    type: string
                  example:
                    - analytics
              required:
                - name
                - description
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Project'
                required:
                  - success
                  - data
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{pid}:
    get:
      tags:
        - Projects
      summary: Get a project
      parameters:
        - schema:
            type: string
            pattern: ^proj-[0-9a-z]{16}$
            example: proj-7h2k9qm4xz7rp3w8
          required: true
          name: pid
          in: path
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Project'
                required:
                  - success
                  - data
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Projects
      summary: Update a project
      parameters:
        - schema:
            type: string
            pattern: ^proj-[0-9a-z]{16}$
            example: proj-7h2k9qm4xz7rp3w8
          required: true
          name: pid
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  example: ML Pipeline
                description:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Project'
                required:
                  - success
                  - data
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Projects
      summary: Delete a project
      parameters:
        - schema:
            type: string
            pattern: ^proj-[0-9a-z]{16}$
            example: proj-7h2k9qm4xz7rp3w8
          required: true
          name: pid
          in: path
      responses:
        '200':
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{pid}/notebooks:
    get:
      tags:
        - Notebooks
      summary: List notebooks in a project
      parameters:
        - schema:
            type: string
            pattern: ^proj-[0-9a-z]{16}$
            example: proj-7h2k9qm4xz7rp3w8
          required: true
          name: pid
          in: path
      responses:
        '200':
          description: List of notebooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SnapshotNotebookEntry'
                required:
                  - success
                  - data
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Notebooks
      summary: Create a notebook
      parameters:
        - schema:
            type: string
            pattern: ^proj-[0-9a-z]{16}$
            example: proj-7h2k9qm4xz7rp3w8
          required: true
          name: pid
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  example: Revenue Analysis
                description:
                  type: string
                  example: Monthly revenue breakdown
                code:
                  type: string
                  example: import marimo as mo
                tags:
                  type: array
                  items:
                    type: string
                  example:
                    - finance
                readme:
                  type: string
                deps:
                  type: string
                runtime:
                  type: object
                  properties:
                    python_version:
                      type: string
                    marimo_version:
                      type: string
              required:
                - title
                - description
                - code
      responses:
        '201':
          description: Notebook created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/NotebookMeta'
                required:
                  - success
                  - data
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{pid}/notebooks/{nid}:
    get:
      tags:
        - Notebooks
      summary: Get notebook metadata
      parameters:
        - schema:
            type: string
            pattern: ^proj-[0-9a-z]{16}$
            example: proj-7h2k9qm4xz7rp3w8
          required: true
          name: pid
          in: path
        - schema:
            type: string
            pattern: ^nb-[0-9a-z]{16}$
            example: nb-3w8h2k9qm4xz7rp3
          required: true
          name: nid
          in: path
      responses:
        '200':
          description: Notebook detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/NotebookDetail'
                required:
                  - success
                  - data
        '404':
          description: Notebook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Notebooks
      summary: Update a notebook
      parameters:
        - schema:
            type: string
            pattern: ^proj-[0-9a-z]{16}$
            example: proj-7h2k9qm4xz7rp3w8
          required: true
          name: pid
          in: path
        - schema:
            type: string
            pattern: ^nb-[0-9a-z]{16}$
            example: nb-3w8h2k9qm4xz7rp3
          required: true
          name: nid
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                description:
                  type: string
                code:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                readme:
                  type: string
                deps:
                  type: string
                message:
                  type: string
                  example: Add regional breakdown
      responses:
        '200':
          description: Notebook updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/NotebookMeta'
                required:
                  - success
                  - data
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notebook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Notebooks
      summary: Delete a notebook (soft-delete)
      parameters:
        - schema:
            type: string
            pattern: ^proj-[0-9a-z]{16}$
            example: proj-7h2k9qm4xz7rp3w8
          required: true
          name: pid
          in: path
        - schema:
            type: string
            pattern: ^nb-[0-9a-z]{16}$
            example: nb-3w8h2k9qm4xz7rp3
          required: true
          name: nid
          in: path
      responses:
        '200':
          description: Notebook deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notebook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{pid}/notebooks/{nid}/content:
    get:
      tags:
        - Notebooks
      summary: Get notebook code
      parameters:
        - schema:
            type: string
            pattern: ^proj-[0-9a-z]{16}$
            example: proj-7h2k9qm4xz7rp3w8
          required: true
          name: pid
          in: path
        - schema:
            type: string
            pattern: ^nb-[0-9a-z]{16}$
            example: nb-3w8h2k9qm4xz7rp3
          required: true
          name: nid
          in: path
      responses:
        '200':
          description: Notebook source code
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      code:
                        type: string
                    required:
                      - code
                required:
                  - success
                  - data
        '404':
          description: Notebook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{pid}/notebooks/{nid}/versions:
    get:
      tags:
        - Notebooks
      summary: List notebook versions
      parameters:
        - schema:
            type: string
            pattern: ^proj-[0-9a-z]{16}$
            example: proj-7h2k9qm4xz7rp3w8
          required: true
          name: pid
          in: path
        - schema:
            type: string
            pattern: ^nb-[0-9a-z]{16}$
            example: nb-3w8h2k9qm4xz7rp3
          required: true
          name: nid
          in: path
      responses:
        '200':
          description: List of versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Version'
                required:
                  - success
                  - data
        '404':
          description: Notebook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{pid}/notebooks/{nid}/versions/{vid}:
    get:
      tags:
        - Notebooks
      summary: Get a specific version
      parameters:
        - schema:
            type: string
            pattern: ^proj-[0-9a-z]{16}$
            example: proj-7h2k9qm4xz7rp3w8
          required: true
          name: pid
          in: path
        - schema:
            type: string
            pattern: ^nb-[0-9a-z]{16}$
            example: nb-3w8h2k9qm4xz7rp3
          required: true
          name: nid
          in: path
        - schema:
            type: string
            pattern: ^ver_[0-9A-Z]{26}$
            example: ver_01HXYZ33333RSTUVWXYZAB
          required: true
          name: vid
          in: path
      responses:
        '200':
          description: Version details with code
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      version:
                        $ref: '#/components/schemas/Version'
                      code:
                        type: string
                    required:
                      - version
                      - code
                required:
                  - success
                  - data
        '404':
          description: Version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{pid}/notebooks/{nid}/sessions:
    post:
      tags:
        - Sessions
      summary: Create a session and provision a sandbox
      parameters:
        - schema:
            type: string
            pattern: ^proj-[0-9a-z]{16}$
            example: proj-7h2k9qm4xz7rp3w8
          required: true
          name: pid
          in: path
        - schema:
            type: string
            pattern: ^nb-[0-9a-z]{16}$
            example: nb-3w8h2k9qm4xz7rp3
          required: true
          name: nid
          in: path
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Session'
                required:
                  - success
                  - data
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notebook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Concurrent session limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{pid}/notebooks/{nid}/sessions/{sid}:
    delete:
      tags:
        - Sessions
      summary: Terminate a session and destroy sandbox
      parameters:
        - schema:
            type: string
            pattern: ^proj-[0-9a-z]{16}$
            example: proj-7h2k9qm4xz7rp3w8
          required: true
          name: pid
          in: path
        - schema:
            type: string
            pattern: ^nb-[0-9a-z]{16}$
            example: nb-3w8h2k9qm4xz7rp3
          required: true
          name: nid
          in: path
        - schema:
            type: string
            pattern: ^sess-[0-9a-z]{16}$
            example: sess-9qm4xz7rp3w8h2k9
          required: true
          name: sid
          in: path
      responses:
        '200':
          description: Session terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{pid}/notebooks/{nid}/sessions/{sid}/heartbeat:
    post:
      tags:
        - Sessions
      summary: Update session heartbeat
      parameters:
        - schema:
            type: string
            pattern: ^proj-[0-9a-z]{16}$
