openapi: 3.1.0
info:
  title: marimohub API
  version: 1.0.0
  description: API for managing Marimo notebooks, projects, and sandboxes
tags:
  - name: Auth
    description: Authentication
  - name: Projects
    description: Project management
  - name: Alerts
    description: Project alert destinations
  - name: Notebooks
    description: Notebook CRUD and versioning
  - name: Sessions
    description: Notebook session lifecycle
  - name: Integrations
    description: Project and organization integrations
  - name: Secrets
    description: Project secret management
  - name: Users
    description: User identity resolution
  - name: Audit
    description: Deployment and project audit events
  - name: System
    description: Deployment metadata
security:
  - cookieAuth: []
  - bearerAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mh_session
      description: Session cookie minted by the OIDC login flow; browsers attach it
        automatically.
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal access token (`mhub_pat_…`) minted at POST
        /api/v1/me/tokens, for CI/CLI/service callers. Acts as the issuing user;
        cannot manage tokens.
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - PRECONDITION_FAILED
                - NOT_FOUND
                - CONFLICT
                - PROPOSAL_RETRY_REQUIRED
                - EDIT_SESSION_OWNED
                - EDIT_SESSION_CHANGED
                - TAKEOVER_IN_PROGRESS
                - FORBIDDEN
                - VALIDATION_ERROR
                - SYNC_NOT_CONFIGURED
                - NOT_INITIALIZED
                - SERVICE_UNAVAILABLE
                - PYTHON_ENV_SETUP_FAILED
                - RESOURCE_EXHAUSTED
                - UNAUTHORIZED
                - USER_SUSPENDED
                - GONE
                - PAYLOAD_TOO_LARGE
                - NO_HTML_SNAPSHOT
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
                required:
                  - field
                  - message
              description: Field-level validation failures.
            request_id:
              type: string
          required:
            - code
            - message
      required:
        - success
        - error
    Me:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type:
            - string
            - 'null'
        picture_url:
          type:
            - string
            - 'null'
          format: uri
        logout_url:
          type:
            - string
            - 'null'
        is_super_admin:
          type: boolean
      required:
        - id
        - email
        - logout_url
        - is_super_admin
    DeploymentInfo:
      type: object
      properties:
        version:
          type: string
      required:
        - version
    Capabilities:
      type: object
      properties:
        federation:
          type: object
          properties:
            available:
              type: boolean
          required:
            - available
        integrations:
          type: object
          properties:
            available:
              type: boolean
          required:
            - available
        source_control:
          type: object
          properties:
            change_request_providers:
              type: array
              items:
                type: string
              description: Provider ids configured to publish pull requests, merge requests,
                or equivalents from notebook sessions.
              example:
                - github
            sync_providers:
              type: array
              items:
                type: string
              description: Provider ids configured for server-initiated pull sync (drift
                lookup and "Sync now").
              example:
                - github
            pull_source_providers:
              type: array
              items:
                type: string
              description: Provider ids configured to create pull-mode sources with
                server-materialized Git metadata.
              example:
                - github
          required:
            - change_request_providers
            - sync_providers
            - pull_source_providers
        project_alerts:
          type: object
          properties:
            available:
              type: boolean
            destination_types:
              type: array
              items:
                type: string
                enum:
                  - slack
                  - webhook
                  - unknown
                description: 'Known values: slack, webhook. Unrecognized values normalize to
                  unknown.'
                example: slack
            selectable_kinds:
              type: array
              items:
                type: string
                enum:
                  - member.invited
                  - member.added
                  - member.role_changed
                  - member.removed
                  - session.takeover
                  - notebook.deleted
                  - project.deleted
                  - app.start_failed
                  - app.unavailable
                  - sync.failed
                  - unknown
                description: 'Known values: member.invited, member.added, member.role_changed,
                  member.removed, session.takeover, notebook.deleted,
                  project.deleted, app.start_failed, app.unavailable,
                  sync.failed. Unrecognized values normalize to unknown.'
                example: member.invited
            max_destinations:
              type: integer
              exclusiveMinimum: 0
          required:
            - available
            - destination_types
            - selectable_kinds
            - max_destinations
        data_browser:
          type: object
          properties:
            available:
              type: boolean
            preview:
              type: boolean
            query:
              type: boolean
            ai_query:
              type: boolean
          required:
            - available
            - preview
            - query
            - ai_query
        viewer_mode:
          type: string
          enum:
            - static
            - applications
            - ephemeral-sandbox
        viewer_session_modes:
          type: array
          items:
            type: string
            enum:
              - edit
              - app
        editor_sandbox_sharing:
          type: string
          enum:
            - shared
            - exclusive
        default_role:
          type:
            - string
            - 'null'
          enum:
            - manager
            - editor
            - viewer
            - null
        limits:
          type: object
          properties:
            max_concurrent_sessions_per_user:
              type:
                - number
                - 'null'
            max_apps_per_project:
              type:
                - number
                - 'null'
            max_request_bytes:
              type: number
            max_versions_per_notebook:
              type: number
            default_page_size:
              type: number
            max_page_size:
              type: number
          required:
            - max_concurrent_sessions_per_user
            - max_apps_per_project
            - max_request_bytes
            - max_versions_per_notebook
            - default_page_size
            - max_page_size
        sandbox_images:
          type: array
          items:
            type: string
        sandbox_startup_timeout_seconds:
          type: number
        compute_profiles:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ComputeResources'
              - type: object
                properties:
                  name:
                    type: string
                required:
                  - name
        compute_profile_override:
          type: string
          enum:
            - none
            - editors
      required:
        - federation
        - integrations
        - source_control
        - project_alerts
        - data_browser
        - viewer_mode
        - viewer_session_modes
        - editor_sandbox_sharing
        - default_role
        - limits
        - sandbox_images
        - sandbox_startup_timeout_seconds
        - compute_profiles
        - compute_profile_override
    ComputeResources:
      type: object
      properties:
        cpu:
          type: number
        memory_bytes:
          type: number
        gpu:
          type: string
    ProjectPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotProjectEntry'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
    SnapshotProjectEntry:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        owner:
          type: string
        status:
          type: string
          enum:
            - active
            - deleted
        created_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        notebook_count:
          type: number
      required:
        - id
        - name
        - description
        - owner
        - status
        - created_at
        - updated_at
        - notebook_count
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        owner:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/ProjectMember'
        status:
          type: string
          enum:
            - active
            - deleted
        created_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        tags:
          type: array
          items:
            type: string
        federation:
          $ref: '#/components/schemas/ProjectFederation'
        your_role:
          type:
            - string
            - 'null'
          enum:
            - admin
            - manager
            - editor
            - viewer
            - null
      required:
        - id
        - name
        - description
        - owner
        - members
        - status
        - created_at
        - updated_at
        - tags
        - your_role
    ProjectMember:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - admin
            - manager
            - editor
            - viewer
      required:
        - role
    ProjectFederation:
      type: object
      properties:
        enabled:
          type: boolean
        target:
          type: string
      required:
        - enabled
    ProjectFederationInput:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
        target:
          type: string
          example: default
      required:
        - enabled
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
      required:
        - success
    AssignableRole:
      type: string
      enum:
        - manager
        - editor
        - viewer
      example: editor
    ProjectAlertDestinationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAlertDestination'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
    ProjectAlertDestination:
      oneOf:
        - type: object
          properties:
            id:
              type: string
              pattern: ^alert-[0-9a-z]{16}$
            name:
              type: string
            kinds:
              type: array
              items:
                type: string
                enum: &a1
                  - member.invited
                  - member.added
                  - member.role_changed
                  - member.removed
                  - session.takeover
                  - notebook.deleted
                  - project.deleted
                  - app.start_failed
                  - app.unavailable
                  - sync.failed
                  - unknown
                description: 'Known values: member.invited, member.added, member.role_changed,
                  member.removed, session.takeover, notebook.deleted,
                  project.deleted, app.start_failed, app.unavailable,
                  sync.failed. Unrecognized values normalize to unknown.'
                example: member.invited
            enabled:
              type: boolean
            verified_at:
              type:
                - string
                - 'null'
              format: date-time
            endpoint_host:
              type: string
            created_by:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            type:
              type: string
              enum:
                - slack
            webhook_url_set:
              type: boolean
              enum:
                - true
          required:
            - id
            - name
            - kinds
            - enabled
            - verified_at
            - endpoint_host
            - created_by
            - created_at
            - updated_at
            - type
            - webhook_url_set
        - type: object
          properties:
            id:
              type: string
              pattern: ^alert-[0-9a-z]{16}$
            name:
              type: string
            kinds:
              type: array
              items:
                type: string
                enum: *a1
                description: 'Known values: member.invited, member.added, member.role_changed,
                  member.removed, session.takeover, notebook.deleted,
                  project.deleted, app.start_failed, app.unavailable,
                  sync.failed. Unrecognized values normalize to unknown.'
                example: member.invited
            enabled:
              type: boolean
            verified_at:
              type:
                - string
                - 'null'
              format: date-time
            endpoint_host:
              type: string
            created_by:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            type:
              type: string
              enum:
                - webhook
            url_set:
              type: boolean
              enum:
                - true
            signing_secret_set:
              type: boolean
              enum:
                - true
          required:
            - id
            - name
            - kinds
            - enabled
            - verified_at
            - endpoint_host
            - created_by
            - created_at
            - updated_at
            - type
            - url_set
            - signing_secret_set
    AuditLogPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
        schema_version:
          type: integer
          exclusiveMinimum: 0
        ts:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        event:
          type: string
          example: project.update
        actor:
          type: string
        metadata:
          type: object
          additionalProperties: {}
      required:
        - id
        - schema_version
        - ts
        - event
        - actor
        - metadata
    AuditEvent:
      type: object
      properties:
        ts:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        event:
          type: string
          example: project.update
        actor:
          type: string
      required:
        - ts
        - event
        - actor
      additionalProperties: {}
    AdminUserPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        updated_at:
          type: string
          format: date-time
        suspended_at:
          type:
            - string
            - 'null'
          format: date-time
        is_super_admin:
          type: boolean
      required:
        - id
        - email
        - name
        - updated_at
        - suspended_at
        - is_super_admin
    DeploymentConfig:
      type: object
      properties:
        deployment:
          $ref: '#/components/schemas/AdminDeployment'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ConfigGroup'
        policy:
          $ref: '#/components/schemas/AdminPolicy'
      required:
        - deployment
        - groups
        - policy
    AdminDeployment:
      type:
        - object
        - 'null'
      properties:
        version:
          type: string
        image:
          type:
            - string
            - 'null'
        sandbox_image:
          type:
            - string
            - 'null'
        started_at:
          type:
            - string
            - 'null'
        replica:
          type:
            - string
            - 'null'
        node:
          type:
            - string
            - 'null'
        backends:
          type:
            - object
            - 'null'
          properties:
            storage:
              type: string
            compute:
              type: string
            auth:
              type: string
          required:
            - storage
            - compute
            - auth
      required:
        - version
        - image
        - sandbox_image
        - started_at
        - replica
        - node
        - backends
    ConfigGroup:
      type: object
      properties:
        name:
          type: string
        backend:
          type:
            - string
            - 'null'
        settings:
          type: array
          items:
            $ref: '#/components/schemas/ConfigSetting'
      required:
        - name
        - backend
        - settings
    ConfigSetting:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        value:
          type:
            - string
            - 'null'
        secret:
          type: boolean
        set:
          type: boolean
      required:
        - key
        - name
        - value
        - secret
        - set
    AdminPolicy:
      type: object
      properties:
        default_role:
          type:
            - string
            - 'null'
          enum:
            - manager
            - editor
            - viewer
            - null
        super_admins:
          type: array
          items:
            type: string
      required:
        - default_role
        - super_admins
    NotebookPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotNotebookEntry'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
    SnapshotNotebookEntry:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - draft
            - active
            - archived
            - deleted
        source_type:
          type: string
          enum:
            - local
            - git
        author:
          type: string
        created_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        tags:
          type: array
          items:
            type: string
        last_run_at:
          type:
            - string
            - 'null'
          format: date-time
          example: 2025-03-05T14:00:00Z
        compute_profile:
          type: string
      required:
        - id
        - title
        - description
        - status
        - source_type
        - author
        - created_at
        - updated_at
        - tags
        - last_run_at
    NotebookMeta:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - draft
            - active
            - archived
            - deleted
        author:
          type: string
        created_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2025-03-05T14:00:00Z
        last_run_at:
          type:
            - string
            - 'null'
          format: date-time
          example: 2025-03-05T14:00:00Z
        tags:
          type: array
          items:
            type: string
        runtime:
          type: object
          properties:
            python_version:
              type: string
            marimo_version:
              type: string
        base_image:
          type: string
        compute_profile:
          type: string
      required:
        - id
        - project_id
        - title
        - description
        - status
        - author
        - created_at
        - updated_at
        - last_run_at
        - tags
    GitNotebookCreateResult:
      type: object
      properties:
        notebook:
          $ref: '#/components/schemas/NotebookMeta'
        sync_url:
          type: string
        sync_token:
          type: string
        sync_error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
          description: Initial pull failure. The draft notebook remains available and can
            be retried with Sync now.
      required:
        - notebook
    SyncToken:
      type: object
      properties:
        sync_url:
          type: string
        sync_token:
          type: string
      required:
        - sync_url
        - sync_token
    GitSourceConfig:
      type: object
      properties:
        repo:
          type: string
          description: 'Normalized repository coordinate: owner/repo or an HTTPS
            repository URL.'
          example: marimo-team/marimohub
        branch:
          type: string
          description: Synced repository branch.
          example: main
        root_path:
          type: string
          description: Repository-relative directory synced into the notebook workspace.
          example: apps
        entry_notebook:
          type: string
          description: Path to the entry notebook relative to root_path.
          example: dashboard.py
      required:
        - repo
        - branch
        - root_path
        - entry_notebook
    SourceDrift:
      type: object
      properties:
        current_commit:
          type:
            - string
            - 'null'
          description: Commit of the last successful sync; null before the first sync.
        remote_commit:
          type: string
          description: Live head of the configured branch, resolved at request time.
        in_sync:
          type: boolean
        pending_config:
          type: boolean
          description: Whether a settings edit is waiting for a matching sync.
        checked_at:
          type: string
          format: date-time
      required:
        - current_commit
        - remote_commit
        - in_sync
        - pending_config
        - checked_at
    SourceSyncResult:
      type: object
      properties:
        synced:
          type: boolean
          description: False when the notebook was already at the branch head.
        commit:
          type: string
        version_id:
          type:
            - string
            - 'null'
      required:
        - synced
        - commit
        - version_id
    NotebookDetail:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/NotebookMeta'
        readme:
          type:
            - string
            - 'null'
        source:
          $ref: '#/components/schemas/Source'
      required:
        - meta
        - readme
        - source
    Source:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - local
            current_version_id:
              type: string
          required:
            - type
            - current_version_id
        - type: object
          properties:
            type:
              type: string
              enum:
                - git
            provider:
              type:
                - string
                - 'null'
              minLength: 1
              description: Detected Git provider id, or null when the repository host is not
                recognized.
              example: github
            repo:
              type: string
              description: 'Normalized repository coordinate: owner/repo or an HTTPS
                repository URL.'
              example: marimo-team/marimohub
            branch:
              type: string
              description: Synced repository branch.
              example: main
            root_path:
              type: string
              description: Repository-relative directory synced into the notebook workspace.
              example: apps
            entry_notebook:
              type: string
              description: Path to the entry notebook relative to root_path.
              example: dashboard.py
            pending_config:
              $ref: '#/components/schemas/GitSourceConfig'
            sync_mode:
              type: string
              enum:
                - push
                - pull
            current_version_id:
              type:
                - string
                - 'null'
            commit:
              type:
                - string
                - 'null'
            last_synced_at:
              type:
                - string
                - 'null'
              format: date-time
              example: 2025-03-05T14:00:00Z
          required:
            - type
            - provider
            - repo
            - branch
            - root_path
            - entry_notebook
            - sync_mode
            - current_version_id
            - commit
            - last_synced_at
    NotebookVersionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotebookVersion'
        next_cursor:
          type:
            - string
            - 'null'
      required:
        - items
        - next_cursor
    NotebookVersion:
      type: object
      properties:
        version_id:
          type: string
        notebook_id:
          type: string
        saved_at:
          type: string
          format: date-time
