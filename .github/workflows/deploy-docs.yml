name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'apps/docs/**'
      - 'packages/api/openapi.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.node-version'
      - '.npmrc'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'apps/docs/**'
      - 'packages/api/openapi.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.node-version'
      - '.npmrc'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_4yGeuLcuikFwlD3XEiQDgX0W
      VERCEL_PROJECT_ID: prj_sXWi3yiwwlNsaNC2S0eFza3b0bkc
      VERCEL_TARGET_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # VitePress uses git history for lastUpdated.
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          version: 1.3.0
          node-version-file: '.node-version'
          sfw: true
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Install Vercel CLI
        run: npm install --global vercel@54.21.1

      - name: Fetch deployment credentials
        id: secrets
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN_DOCS }}
          doppler-project: marimohub-oss
          doppler-config: docs

      - name: Pull Vercel settings
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
        run: vercel pull --yes --environment="$VERCEL_TARGET_ENV" --git-branch="$DEPLOY_BRANCH" --token="$VERCEL_TOKEN"

      - name: Build docs on the runner
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
        run: vercel build --target="$VERCEL_TARGET_ENV" --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt docs
        env:
          VERCEL_TOKEN: ${{ steps.secrets.outputs.VERCEL_TOKEN }}
        run: |
          vercel deploy --prebuilt --yes --target="$VERCEL_TARGET_ENV" \
            --token="$VERCEL_TOKEN" \
            --meta githubCommitRef="$DEPLOY_BRANCH" \
            --meta githubCommitSha="$GITHUB_SHA" > deployment.json
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const output = readFileSync('deployment.json', 'utf8').trim();
          let url;
          if (output.startsWith('https://')) {
            url = output;
          } else {
            const deployment = JSON.parse(output);
            url = deployment.url;
          }
          if (!url) throw new Error('Vercel did not return a deployment URL');
          if (!url.startsWith('https://')) url = `https://${url}`;
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Docs deployment (${process.env.VERCEL_TARGET_ENV}): ${url}\n`);
          console.log(url);
          JS
