name: E2E

# Browser end-to-end tests (Playwright) driving the real SPA against a local
# server wired to the in-memory / dev-auth / no-compute ports. No external deps.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # See ci.yml for why setup-vp is SHA-pinned + sfw + frozen install.
      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          version: 0.1.24
          node-version: 22
          sfw: true
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      # The Playwright webServer shells out to `pnpm exec vp run`, so pnpm must be on PATH.
      - run: corepack enable
      - run: pnpm --filter @marimo-hub/e2e install-browser
      - run: pnpm e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
