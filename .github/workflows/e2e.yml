name: E2E

# Browser end-to-end tests (Playwright) driving the real SPA against a local
# server wired to in-memory storage and dev auth. Chromium also starts a local kernel.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-tests:
    name: ${{ matrix.suite }} (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Match @playwright/test in pnpm-lock.yaml; includes browsers and OS dependencies.
      image: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        suite: [hub, bridge]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Align container home ownership
        # GitHub mounts the runner's home; Firefox requires it to belong to the container user.
        run: chown "$(id -u):$(id -g)" "$HOME"
      # The Playwright webServer shells out to `pnpm exec vp run`, so pnpm must be
      # on PATH (version comes from the `packageManager` field in package.json).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # See ci.yml for why setup-vp is SHA-pinned + sfw + frozen install.
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          version: 1.3.0
          node-version-file: '.node-version'
          sfw: true
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      # Forks must not read the shared cache; only main pushes can update it.
      - name: Restore Vite Task cache
        if: matrix.suite == 'hub' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        id: vite-task-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-e2e-${{ matrix.browser }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-e2e-${{ matrix.browser }}-${{ runner.os }}-${{ runner.arch }}-
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Install uv
        if: matrix.suite == 'hub' && matrix.browser == 'chromium'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: '3.13'
          # E2E installs marimo below; avoid scanning pnpm's node_modules for Python manifests.
          cache-dependency-glob: .github/workflows/e2e.yml
      - name: Pre-warm marimo
        if: matrix.suite == 'hub' && matrix.browser == 'chromium'
        run: uv run --no-project --with marimo python -c "import marimo"

      - name: Check app source confidentiality
        if: matrix.suite == 'hub' && matrix.browser == 'chromium'
        run: uv run scripts/test-app-source.py

      - name: Notebook bridge browser conformance
        if: matrix.suite == 'bridge'
        run: pnpm --filter @marimo-hub/notebook-bridge test:browser --project=${{ matrix.browser }}

      - run: pnpm e2e
        if: matrix.suite == 'hub'
        env:
          E2E_BROWSER: ${{ matrix.browser }}

      - name: Upload report
        if: '!cancelled()'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.suite }}-${{ matrix.browser }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            packages/notebook-bridge/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save Vite Task cache
        if: success() && matrix.suite == 'hub' && github.event_name == 'push'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  bridge-runtime:
    name: Notebook bridge runtime compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Match @playwright/test in pnpm-lock.yaml; includes browsers and OS dependencies.
      image: mcr.microsoft.com/playwright:v1.61.0-noble@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # See ci.yml for why setup-vp is SHA-pinned + sfw + frozen install.
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          version: 1.3.0
          node-version-file: '.node-version'
          sfw: true
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: '3.13'
          cache-dependency-glob: |
            .github/workflows/e2e.yml
            packages/notebook-bridge/browser/runtime.spec.ts

      - name: Notebook bridge marimo compatibility
        run: pnpm --filter @marimo-hub/notebook-bridge test:browser --project=runtime

      - name: Upload report
        if: '!cancelled()'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-bridge-runtime
          path: packages/notebook-bridge/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Keep the existing required checks while including every split suite.
  e2e:
    name: e2e (${{ matrix.browser }})
    needs: [browser-tests, bridge-runtime]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - run: test "$BROWSERS" = success && test "$RUNTIME" = success
        env:
          BROWSERS: ${{ needs.browser-tests.result }}
          RUNTIME: ${{ needs.bridge-runtime.result }}
