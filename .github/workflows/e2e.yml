name: E2E

# Browser end-to-end tests (Playwright) driving the real SPA against a local
# server wired to the in-memory / dev-auth / no-compute ports. No external deps.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The Playwright webServer shells out to `pnpm exec vp run`, so pnpm must be
      # on PATH (version comes from the `packageManager` field in package.json).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      # See ci.yml for why setup-vp is SHA-pinned + sfw + frozen install.
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          version: 0.1.24
          node-version-file: '.node-version'
          sfw: true
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: pnpm --filter @marimo-hub/e2e install-browser
      - run: pnpm e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
