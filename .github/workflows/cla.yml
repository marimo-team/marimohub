name: 'CLA Assistant'

# Signatures are stored in the marimo-team/cla-signers repo under a
# marimohub-specific path. The write token is minted from the marimo-cla-bot
# App, which has contents: write only and is installed on the signers repo only.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false # Don't cancel CLA checks

permissions: {}

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    # Write scopes on a pull_request_target job are safe only while nothing
    # here checks out or executes PR-controlled content. Don't add a checkout
    # or build step.
    steps:
      - name: Generate app token
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.CLA_APP_ID }}
          private-key: ${{ secrets.CLA_APP_PRIVATE_KEY }}
          owner: marimo-team
          repositories: cla-signers

      - name: 'CLA Assistant'
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          path-to-signatures: 'signatures/marimohub/cla.json'
          path-to-document: 'https://marimo.io/cla'
          # branch should not be protected
          branch: 'main'
          allowlist: bot*,copilot
          remote-organization-name: marimo-team
          remote-repository-name: cla-signers
          lock-pullrequest-aftermerge: false
