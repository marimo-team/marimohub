name: Release

# Triggered by a semver tag, normally pushed by release-tag.yml when a
# "release: X.Y.Z" PR is merged (see development_docs/releasing.md).
# This publishes the container image and Helm chart to GHCR, builds native CLI
# archives and binary wheels, and creates a GitHub release with checksums,
# provenance, an SBOM, and a changelog generated from commits since the prior
# tag. The chart version, appVersion, and image tag are pinned to the git tag.
#   helm upgrade --install marimohub oci://ghcr.io/marimo-team/charts/marimohub \
#     --version 1.4.2 -n marimohub -f values.yaml
on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/marimohub
  CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  cli-assets:
    name: Test and generate CLI assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test
        working-directory: apps/cli
        run: cargo test --locked
      - name: Generate shell completions and man pages
        working-directory: apps/cli
        run: cargo run --locked --example generate-assets -- generated
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-generated-assets
          path: apps/cli/generated
          if-no-files-found: error

  cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: cli-assets
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: x86_64-apple-darwin
            macos_deployment_target: '10.12'
          - os: macos-15
            target: aarch64-apple-darwin
            macos_deployment_target: '11.0'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-generated-assets
          path: apps/cli/generated
      - name: Install Rust target
        shell: bash
        working-directory: apps/cli
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"
      - name: Install dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Build archive
        shell: bash
        working-directory: apps/cli
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: |
          dist build --artifacts=local --target "${{ matrix.target }}" \
            --tag "$GITHUB_REF_NAME" --allow-dirty
      - name: Build binary wheel
        shell: bash
        working-directory: apps/cli
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: |
          python -m pip install 'maturin==1.9.4'
          python -m maturin build --profile dist --locked \
            --target "${{ matrix.target }}" \
            --out ../../wheelhouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mohub-${{ matrix.target }}
          path: |
            apps/cli/target/distrib/*.tar.gz
            apps/cli/target/distrib/*.zip
            apps/cli/target/distrib/*.msi
            apps/cli/target/distrib/*.sha256
            apps/cli/target/distrib/mohub-*-update*
            wheelhouse/*.whl
          if-no-files-found: error

  cli-linux-x64:
    name: Build CLI (x86_64-unknown-linux-gnu, glibc 2.28)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64:latest
    timeout-minutes: 25
    needs: cli-assets
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-generated-assets
          path: apps/cli/generated
      - name: Install build tools
        shell: bash
        run: |
          dnf install -y python3-pip
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Build archive
        shell: bash
        working-directory: apps/cli
        run: |
          dist build --artifacts=local --target x86_64-unknown-linux-gnu \
            --tag "$GITHUB_REF_NAME" --allow-dirty
      - name: Build binary wheel
        shell: bash
        working-directory: apps/cli
        run: |
          /opt/python/cp39-cp39/bin/python -m pip install 'maturin==1.9.4'
          /opt/python/cp39-cp39/bin/python -m maturin build \
            --profile dist --locked --out ../../wheelhouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mohub-x86_64-unknown-linux-gnu
          path: |
            apps/cli/target/distrib/*.tar.gz
            apps/cli/target/distrib/*.sha256
            apps/cli/target/distrib/mohub-*-update*
            wheelhouse/*.whl
          if-no-files-found: error

  cli-installers:
    name: Build CLI installers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [cli-assets, cli, cli-linux-x64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-generated-assets
          path: apps/cli/generated
      - name: Install dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Build installers
        working-directory: apps/cli
        run: dist build --artifacts=global --tag "$GITHUB_REF_NAME" --allow-dirty
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mohub-installers
          path: |
            apps/cli/target/distrib/*.sh
            apps/cli/target/distrib/*.ps1
            apps/cli/target/distrib/*.rb
            apps/cli/target/distrib/*.tar.gz
            apps/cli/target/distrib/*.sha256
            apps/cli/target/distrib/*.sum
          if-no-files-found: error

  image:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Derive version and build time
        id: v
        # Strip the leading "v" from the tag -> semver used for image + chart.
        # The `v*.*.*` trigger is a glob, not a semver check, and the version is
        # reused in shell steps, so reject anything but digits and dots. Build
        # time comes from the tagged commit: head_commit is null for annotated
        # tag pushes.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          # v1.4.2 -> tags 1.4.2, 1.4, 1, latest, plus the commit SHA.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MARIMOHUB_VERSION=${{ steps.v.outputs.version }}
            MARIMOHUB_IMAGE=${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            MARIMOHUB_BUILD_TIME=${{ steps.v.outputs.build_time }}

  chart:
    name: Package & push Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Derive version
        id: v
        # Same validation as the image job: the tag glob is not a semver check.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR (Helm OCI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"

      - name: Lint
        run: helm lint charts/marimohub

      - name: Package
        # Pin chart version AND appVersion to the released tag so a chart version
        # uniquely identifies an image. Defaulting image.tag to appVersion in the
        # chart means end-users get the matching image for free.
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          helm package charts/marimohub \
            --version "$VERSION" \
            --app-version "$VERSION"

      - name: Push
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: helm push "marimohub-$VERSION.tgz" "$CHART_REGISTRY"

  publish-cli-release:
    name: Publish CLI release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [cli, cli-linux-x64, cli-installers]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # changelogithub diffs against the previous tag, so it needs full history.
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mohub-*
          path: release-downloads

      - name: Stage and validate CLI artifacts
        run: scripts/stage-cli-release-assets.sh release-downloads release-assets

      - name: Generate changelog and create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME already exists; keeping its release notes."
              break
            fi
            if npx changelogithub@14.0.0; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then
              exit 1
            fi
            sleep $((2 ** attempt))
          done

      - name: Attach CLI artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          scripts/retry.sh gh release upload "$GITHUB_REF_NAME"
          release-assets/* --clobber

  cli-release-metadata:
    name: Publish CLI release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [publish-cli-release]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mohub-*
          path: release-downloads

      - name: Stage and validate CLI artifacts
        run: scripts/stage-cli-release-assets.sh release-downloads release-assets

      - name: Create checksums and dependency SBOM
        env:
          CARGO_NET_RETRY: 5
        run: |
          scripts/retry.sh cargo install cargo-cyclonedx --locked --version 0.5.7
          (cd apps/cli && cargo cyclonedx \
            --format json --override-filename mohub.cdx)
          cp apps/cli/mohub.cdx.json release-assets/mohub.cdx.json
          (cd release-assets && sha256sum ./* > SHA256SUMS)

      - name: Attest CLI artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'release-assets/*'

      - name: Attach release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          scripts/retry.sh gh release upload "$GITHUB_REF_NAME"
          release-assets/mohub.cdx.json release-assets/SHA256SUMS --clobber

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Report the overall outcome once every release job has finished.
    needs:
      [cli, cli-linux-x64, cli-installers, image, chart, publish-cli-release, cli-release-metadata]
    if: always()
    steps:
      - name: Notify Slack - Release Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_RELEASES }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ Release completed successfully for marimohub ${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Release successful*\n\n*Repository:* marimohub\n*Version:* ${{ github.ref_name }}\n*Image:* `${{ env.IMAGE }}:${{ github.ref_name }}`\n*Release:* <https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}|View release>"
                  }
                }
              ]
            }

      - name: Notify Slack - Release Failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_RELEASES }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ Release failed for marimohub ${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Release failed*\n\n*Repository:* marimohub\n*Version:* ${{ github.ref_name }}\n*Commit:* <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Triggered by:* ${{ github.actor }}\n*Workflow:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }
