name: Catalog conformance

# Live `browseContract` suites (@marimo-hub/core/testing/browse-contract)
# against real catalog/engine servers. Each suite gates itself on its
# MARIMOHUB_TEST_* env var and stays skipped in the ordinary CI test job; this
# workflow starts the servers and turns them on. To cover a new kind, start
# its server below. Add its env var and live test file to the test step.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  catalog-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          version: 0.1.24
          node-version-file: '.node-version'
          sfw: true
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      - name: Start catalog servers
        run: |
          docker compose -f scripts/dev-services/compose.yaml up -d
          set +e
          docker compose -f scripts/dev-services/compose.yaml wait iceberg-seed
          iceberg_seed_wait_status=$?
          set -e
          iceberg_seed_container=$(docker compose -f scripts/dev-services/compose.yaml ps -q --all iceberg-seed)
          iceberg_seed_exit_code=$(docker inspect --format '{{.State.ExitCode}}' "$iceberg_seed_container")
          if [ "$iceberg_seed_wait_status" -ne 0 ] || [ "$iceberg_seed_exit_code" -ne 0 ]; then
            docker logs "$iceberg_seed_container"
            exit 1
          fi
          docker run -d --name trino -p 18080:8080 trinodb/trino:483
          docker run -d --name clickhouse -p 18123:8123 \
            -e CLICKHOUSE_SKIP_USER_SETUP=1 clickhouse/clickhouse-server:26.2

      - name: Wait for catalog servers
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:19000/minio/health/ready >/dev/null && break
            sleep 1; [ "$i" = 30 ] && exit 1
          done
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18181/v1/config && break
            sleep 1; [ "$i" = 30 ] && exit 1
          done
          for i in $(seq 1 60); do
            body=$(curl -fsS -X POST -H 'X-Trino-User: readiness' \
              --data 'SELECT 1' http://127.0.0.1:18080/v1/statement) || true
            next=$(printf '%s' "$body" | jq -r '.nextUri // empty')
            for _ in $(seq 1 100); do
              [ -n "$next" ] || break
              body=$(curl -fsS -H 'X-Trino-User: readiness' "$next") || break
              next=$(printf '%s' "$body" | jq -r '.nextUri // empty')
            done
            [ -n "$body" ] && [ -z "$next" ] && \
              printf '%s' "$body" | jq -e '.error == null' >/dev/null && break
            sleep 1; [ "$i" = 60 ] && exit 1
          done
          for i in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:18123/?query=SELECT%201' && break
            sleep 1; [ "$i" = 30 ] && exit 1
          done

      - name: Browse contracts against the live servers
        env:
          MARIMOHUB_TEST_ICEBERG_REST_URI: http://127.0.0.1:18181
          MARIMOHUB_TEST_ICEBERG_BROKER_URI: http://127.0.0.1:18181
          MARIMOHUB_TEST_ICEBERG_BROKER_S3_ENDPOINT: http://127.0.0.1:19000
          MARIMOHUB_TEST_TRINO_HOST: 127.0.0.1
          MARIMOHUB_TEST_TRINO_PORT: 18080
          MARIMOHUB_TEST_CLICKHOUSE_HOST: 127.0.0.1
          MARIMOHUB_TEST_CLICKHOUSE_PORT: 18123
        run: |
          vp test \
            packages/core/src/services/integrations/kinds/icebergRest.browse.live.test.ts \
            packages/core/src/services/integrations/kinds/trino.browse.live.test.ts \
            packages/core/src/services/integrations/kinds/clickhouse.browse.live.test.ts \
            packages/duckdb-wasm-runtime/src/icebergHttpBroker.test.ts \
            packages/config/src/duckdbHttpBroker.test.ts \
            packages/config/src/duckdbHttpBroker.live.test.ts
