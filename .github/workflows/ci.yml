name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs on new pushes to the same PR; let main runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Installs Vite+/Node, caches deps, and runs a frozen `vp install` wrapped in
      # Socket Firewall (sfw). SHA-pinned so a moved tag can't change what runs.
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          version: 0.1.24
          node-version-file: '.node-version'
          sfw: true
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']

      # Forks must not read the shared cache; only main pushes can update it.
      - name: Restore Vite Task cache
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        id: vite-task-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - run: vp check
      - run: vp run -r typecheck
      - run: vp run audit:prod
      # The full tree includes build tooling that runs with repository write access.
      - name: Audit all dependencies (non-blocking)
        continue-on-error: true
        run: vp pm audit -- --audit-level=high

      # Build resolves packages from source, not dist, so it's independent of the
      # tests — run both at once. `--configLoader=runner`/`--pool=threads` cut the
      # per-worker cold starts the old bare `vp run -r test` paid.
      - name: Test and build
        run: |
          vp run -r test --configLoader=runner --pool=threads & test_pid=$!
          vp run -r build & build_pid=$!
          rc=0
          wait $test_pid || rc=1
          wait $build_pid || rc=1
          exit $rc

      # The build task restores dist/ when its cache hits.
      - run: node scripts/check-bundle-size.mjs

      - name: Save Vite Task cache
        if: success() && github.event_name == 'push'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
