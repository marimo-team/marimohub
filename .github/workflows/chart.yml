name: Chart

# Lint and validate the Helm chart. Scoped to chart + workflow changes so it
# stays off unrelated PRs.
on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/chart.yml'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/chart.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: helm lint
        run: helm lint --strict charts/marimohub

      - name: Verify surface image upgrade compatibility
        run: |
          legacy_image=ghcr.io/example/sandbox:legacy-vscode
          current_image=ghcr.io/example/sandbox:tools
          legacy_render=$(helm template test charts/marimohub \
            --set surfaces.vscode.enabled=true \
            --set surfaces.vscode.sandboxImage=$legacy_image)
          grep -Fq "MARIMOHUB_COMPUTE_IMAGE: \"$legacy_image\"" <<< "$legacy_render"
          current_render=$(helm template test charts/marimohub \
            --set surfaces.vscode.enabled=true \
            --set surfaces.vscode.sandboxImage=$legacy_image \
            --set surfaces.sandboxImage=$current_image)
          grep -Fq "MARIMOHUB_COMPUTE_IMAGE: \"$current_image\"" <<< "$current_render"
          if grep -Fq "MARIMOHUB_COMPUTE_IMAGE: \"$legacy_image\"" <<< "$current_render"; then
            exit 1
          fi

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      # Render with the defaults and with the example values, then validate the
      # manifests against the upstream Kubernetes JSON schemas. Treats a missing
      # schema (none of our kinds are CRDs) as an error.
      - name: Render & validate manifests
        run: |
          for values in "" "-f charts/marimohub/ci/example-values.yaml" "-f charts/marimohub/ci/kubernetes-secrets-values.yaml"; do
            echo "::group::helm template ${values:-(defaults)}"
            helm template test charts/marimohub $values \
              | kubeconform -strict -summary -verbose \
                  -kubernetes-version 1.29.0 \
                  -schema-location default
            echo "::endgroup::"
          done

      - name: Verify Kubernetes Secret resolver RBAC
        run: |
          render=$(helm template test charts/marimohub \
            -f charts/marimohub/ci/kubernetes-secrets-values.yaml)
          ruby -ryaml -e '
            documents = YAML.load_stream(STDIN.read).compact
            roles = documents.select { |document| document["kind"] == "Role" }
            bindings = documents.select { |document| document["kind"] == "RoleBinding" }
            expected = {
              "connections-a" => ["provider-a", "provider-b"],
              "connections-b" => ["provider-c"],
            }
            abort "unexpected Secret Role count" unless roles.length == expected.length
            abort "unexpected Secret RoleBinding count" unless bindings.length == expected.length
            role_namespaces = roles.map { |role| role.dig("metadata", "namespace") }.sort
            binding_namespaces = bindings.map { |binding| binding.dig("metadata", "namespace") }.sort
            abort "unexpected Secret Role namespaces" unless role_namespaces == expected.keys.sort
            abort "unexpected Secret RoleBinding namespaces" unless binding_namespaces == expected.keys.sort
            roles.each do |role|
              namespace = role.dig("metadata", "namespace")
              names = expected.fetch(namespace) { abort "unexpected Secret Role namespace" }
              rule = {
                "apiGroups" => [""],
                "resources" => ["secrets"],
                "resourceNames" => names,
                "verbs" => ["get"],
              }
              abort "unexpected Secret Role rules" unless role["rules"] == [rule]
              role_name = role.dig("metadata", "name")
              binding = bindings.find { |item| item.dig("metadata", "namespace") == namespace }
              abort "missing Secret RoleBinding" unless binding
              abort "unexpected Secret RoleBinding name" unless binding.dig("metadata", "name") == role_name
              expected_role_ref = {
                "apiGroup" => "rbac.authorization.k8s.io",
                "kind" => "Role",
                "name" => role_name,
              }
              abort "unexpected Secret RoleBinding roleRef" unless binding["roleRef"] == expected_role_ref
              expected_subjects = [{
                "kind" => "ServiceAccount",
                "name" => "test-marimohub",
                "namespace" => "default",
              }]
              abort "unexpected Secret RoleBinding subjects" unless binding["subjects"] == expected_subjects
            end
          ' <<< "$render"
          grep -Fq 'name: MARIMOHUB_SECRETS_KUBERNETES_ALLOWED_SECRETS' <<< "$render"
          grep -Fq '\"name\":\"provider-a\"' <<< "$render"
          grep -Fq '\"name\":\"provider-b\"' <<< "$render"
          grep -Fq '\"name\":\"provider-c\"' <<< "$render"
          grep -Fq '\"projects\":\"*\"' <<< "$render"

          if helm template test charts/marimohub \
            --set secretResolvers.kubernetes.enabled=true; then
            exit 1
          fi

          if token_mount_error=$(helm template test charts/marimohub \
            -f charts/marimohub/ci/kubernetes-secrets-values.yaml \
            --set serviceAccount.automountServiceAccountToken=false 2>&1); then
            exit 1
          fi
          grep -Fq 'serviceAccount.automountServiceAccountToken must be true' \
            <<< "$token_mount_error"

          assert_invalid_policy() {
            if helm template test charts/marimohub \
              --set secretResolvers.kubernetes.enabled=true \
              --set-json "secretResolvers.kubernetes.allowedSecrets=$1" >/dev/null 2>&1; then
              echo "expected invalid Kubernetes Secret policy to fail"
              return 1
            fi
          }
          assert_invalid_policy '[{"namespace":"Connections","name":"provider","projects":"*"}]'
          assert_invalid_policy '[{"namespace":"connections","name":"Provider","projects":"*"}]'
          assert_invalid_policy '[{"namespace":"connections","name":"provider","projects":[]}]'
          assert_invalid_policy '[{"namespace":"connections","name":"provider","projects":["invalid"]}]'
          assert_invalid_policy '[{"namespace":"connections","name":"provider","projects":["proj-0000000000000000","proj-0000000000000000"]}]'
          assert_invalid_policy '[{"namespace":"connections","name":"provider"}]'
          assert_invalid_policy '[{"namespace":"connections","name":"provider","projects":"*","unknown":true}]'
          assert_invalid_policy '[{"namespace":"connections","name":"provider","projects":"*"},{"namespace":"connections","name":"provider","projects":"*"}]'

          if helm template test charts/marimohub \
            --set secretResolvers.kubernetes.enabled=true \
            --set secretResolvers.kubernetes.cacheTtlSeconds=-1 \
            --set-json 'secretResolvers.kubernetes.allowedSecrets=[{"namespace":"connections","name":"provider","projects":"*"}]'; then
            exit 1
          fi
