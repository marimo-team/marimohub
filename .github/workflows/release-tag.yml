name: Auto-tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  create-tag:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      startsWith(github.event.pull_request.title, 'release: ')
    runs-on: ${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 10
    concurrency:
      group: release-tag-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout merged release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate release
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          VERSION=$(scripts/release-tag.sh validate "v${PR_TITLE#release: }")
          test "$PR_BRANCH" = "release/$VERSION"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test "$(node -p "require('./packages/iac/package.json').version")" = "$VERSION"
          test "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' apps/cli/Cargo.toml | head -1)" = "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag merged release
        uses: marimo-team/internal-gh-actions/release-tag@fb4c07d81a85b62f55e710c0224cebcf9bc9dc74
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
