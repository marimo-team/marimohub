name: Auto-tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  create-tag:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      startsWith(github.event.pull_request.title, 'release: ')
    environment: release
    runs-on: ${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 10
    concurrency:
      group: release-tag-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout merged release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check package versions
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$(node -p "require('./packages/iac/package.json').version")" = "$VERSION"
          test "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' apps/cli/Cargo.toml | head -1)" = "$VERSION"

      - name: Tag merged release
        uses: marimo-team/internal-gh-actions/release-tag@36a2bd9a76109b91c9dc0bc65bfab95c9b632a3b
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  notify-approval:
    name: Notify release approval
    if: >-
      github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/') && startsWith(github.event.pull_request.title, 'release: ')
    runs-on: ${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 12
    permissions:
      actions: read
      pull-requests: read
      contents: read
    steps:
      - uses: marimo-team/internal-gh-actions/release-approval-notification@962bf922f5b45dba9a650de62f825c24f3e99f87
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL_RELEASES }}
