name: Prepare release PR
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version or patch, minor, major
        required: true
        type: string
permissions: {}
concurrency:
  group: prepare-release-pr
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ${{ vars.CI_RUNNER_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Test version preparation
        run: node --test scripts/prepare-release.test.mjs
      - name: Prepare versions
        id: version
        uses: marimo-team/internal-gh-actions/prepare-release@36a2bd9a76109b91c9dc0bc65bfab95c9b632a3b
        with:
          version: ${{ inputs.version }}
      - name: Open release PR
        id: pr
        uses: marimo-team/internal-gh-actions/release-pr@36a2bd9a76109b91c9dc0bc65bfab95c9b632a3b
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          current-version: ${{ steps.version.outputs.current-version }}
          manifest: ${{ steps.version.outputs.manifest }}
          version: ${{ steps.version.outputs.version }}
          files: ${{ steps.version.outputs.files }}
      - name: Link release PR
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: echo "Release PR $PR_URL" >> "$GITHUB_STEP_SUMMARY"
