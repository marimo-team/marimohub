name: Publish MinIO images

on:
  push:
    branches: [main]
    tags: ['minio-images/**']
    paths:
      - 'scripts/dev-services/minio/Dockerfile'
      - '.github/workflows/publish-minio-image.yml'
  pull_request:
    paths:
      - 'scripts/dev-services/minio/Dockerfile'
      - '.github/workflows/publish-minio-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}-minio

jobs:
  build:
    name: MinIO (${{ matrix.release.name }}, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        release:
          - name: ci
            version: v0.0.0-20250907161309-07c3a429bfed
          # This release retains the local dev console.
          - name: dev
            version: v0.0.0-20250422221226-0d7408fc9969
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: scripts/dev-services/minio
          platforms: linux/${{ matrix.platform.arch }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.release.name }}-${{ matrix.platform.arch }}
          build-args: MINIO_VERSION=${{ matrix.release.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=minio-${{ matrix.release.name }}-${{ matrix.platform.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=minio-{0}-{1}', matrix.release.name, matrix.platform.arch) || '' }}

      - name: Check server and client
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.release.name }}-${{ matrix.platform.arch }}
        run: |
          docker run --rm --entrypoint mc "$IMAGE:$IMAGE_TAG" --version
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            "$IMAGE:$IMAGE_TAG" server /data
          trap 'docker logs minio; docker rm -f minio' EXIT
          curl --retry 30 --retry-delay 1 --retry-all-errors --fail http://localhost:9000/minio/health/ready
          docker exec minio mc alias set local http://localhost:9000 minioadmin minioadmin
          docker exec minio mc mb local/smoke-test
          docker exec minio mc stat local/smoke-test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish platform image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.release.name }}-${{ matrix.platform.arch }}
        run: docker push "$IMAGE:$IMAGE_TAG"

  publish:
    name: Publish multi-platform manifests
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and report digest pins
        env:
          REVISION: ${{ github.sha }}
        run: |
          for variant in ci dev; do
            image="$IMAGE:$REVISION-$variant"
            docker buildx imagetools create --tag "$image" \
              "$image-amd64" "$image-arm64"
            digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)
            echo "$variant: \`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done
