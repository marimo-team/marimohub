name: Publish sandbox image

on:
  push:
    branches: [main]
    paths:
      - 'images/marimo-sandbox/**'
      - 'examples/sandbox-image/acceptance-test.sh'
      - 'packages/notebook-bridge/src/runtime.generated.ts'
      # Surface env names are a contract with the bundled marimo-pair skill.
      - 'packages/core/src/services/runtime/surfaces/**'
      - '.github/workflows/publish-sandbox-image.yml'
      - 'scripts/publish-image-manifest.sh'
  pull_request:
    paths:
      - 'images/marimo-sandbox/**'
      - 'examples/sandbox-image/acceptance-test.sh'
      - 'packages/notebook-bridge/src/runtime.generated.ts'
      # Surface env names are a contract with the bundled marimo-pair skill.
      - 'packages/core/src/services/runtime/surfaces/**'
      - '.github/workflows/publish-sandbox-image.yml'
      - 'scripts/publish-image-manifest.sh'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Sandbox (${{ matrix.variant.target }}, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - target: release
            suffix: ''
          - target: vscode
            suffix: '-vscode'
          - target: opencode
            suffix: '-opencode'
          - target: tools
            suffix: '-tools'
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        id: buildx

      - name: Test OpenCode verification deadlines
        if: matrix.variant.target == 'release'
        run: python3 images/marimo-sandbox/test-opencode-check.py

      # Computed once so every verify build and publish build share one epoch;
      # otherwise a run spanning a week boundary would publish an unverified rebuild.
      - name: Compute cache epoch
        id: epoch
        run: echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build sandbox image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: images/marimo-sandbox
          build-contexts: notebook_bridge=packages/notebook-bridge
          build-args: CACHE_EPOCH=${{ steps.epoch.outputs.value }}
          target: ${{ matrix.variant.target }}
          platforms: linux/${{ matrix.platform.arch }}
          load: true
          tags: marimo-sandbox:ci
          cache-from: type=gha,scope=marimo-sandbox-${{ matrix.platform.arch }}
          # The tools target includes every variant's build stages.
          cache-to: ${{ github.event_name == 'push' && matrix.variant.target == 'tools' && format('type=gha,scope=marimo-sandbox-{0},mode=max,timeout=3m,ignore-error=true', matrix.platform.arch) || '' }}

      - name: Run acceptance tests
        if: matrix.variant.target == 'release'
        run: examples/sandbox-image/acceptance-test.sh marimo-sandbox:ci images/marimo-sandbox
        env:
          SKIP_BUILD: '1'

      - name: Verify pre-installed bridge identity
        if: matrix.variant.target == 'release'
        run: |
          expected=$(sed -n "s/^export const ARTIFACT_ID = '\([^']*\)';/\1/p" packages/notebook-bridge/src/runtime.generated.ts)
          actual=$(docker run --rm marimo-sandbox:ci python -c 'import importlib.resources; print(importlib.resources.files("marimohub_notebook_bridge").joinpath("identity").read_text())')
          test -n "$expected"
          test "$actual" = "$expected"

      - name: Verify DuckDB extensions offline with default and mounted homes
        if: matrix.variant.target == 'release'
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=${PWD}/images/marimo-sandbox,dst=/tmp/duckdb-check,readonly" \
            marimo-sandbox:ci python /tmp/duckdb-check/test-duckdb.py
          docker run --rm --network none \
            --mount "type=bind,src=${PWD}/images/marimo-sandbox,dst=/tmp/duckdb-check,readonly" \
            --tmpfs /home/appuser:uid=1000,gid=1000,mode=0700 \
            marimo-sandbox:ci sh -lc 'python /tmp/duckdb-check/test-duckdb.py'

      - name: Verify bridge reinstall and uv cache ownership as sandbox user
        if: matrix.variant.target == 'release'
        run: |
          docker run --rm --network none -i \
            --mount "type=bind,src=${PWD}/packages/notebook-bridge/src/runtime.generated.ts,dst=/tmp/notebook-bridge.ts,readonly" \
            marimo-sandbox:ci python < images/marimo-sandbox/test-bridge.py

      - name: Verify VS Code variant
        if: matrix.variant.target == 'vscode' || matrix.variant.target == 'tools'
        run: |
          docker run --rm marimo-sandbox:ci code-server --version
          docker run --rm marimo-sandbox:ci sh -c '
            installed="$(code-server --list-extensions --extensions-dir /opt/marimohub/vscode-extensions)"
            for extension in marimo-team.vscode-marimo detachhead.basedpyright charliermarsh.ruff tamasfe.even-better-toml; do
              printf "%s\n" "$installed" | grep -Fx "$extension"
            done
          '

      - name: Verify OpenCode variant
        if: matrix.variant.target == 'opencode' || matrix.variant.target == 'tools'
        timeout-minutes: 3
        run: |
          docker run --rm marimo-sandbox:ci opencode --version | grep -F '1.18.17'
          docker run --rm marimo-sandbox:ci jq --version
          docker run --rm marimo-sandbox:ci test -f /home/appuser/.agents/skills/marimo-pair/SKILL.md
          docker run --rm -v "$PWD/images/marimo-sandbox/test-marimo-pair.py:/tmp/test-marimo-pair.py:ro" marimo-sandbox:ci python /tmp/test-marimo-pair.py
          docker run --rm \
            --mount "type=bind,src=${PWD}/images/marimo-sandbox/check-opencode.sh,dst=/tmp/check-opencode.sh,readonly" \
            marimo-sandbox:ci timeout --kill-after=5s 120s bash /tmp/check-opencode.sh

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        id: publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: images/marimo-sandbox
          build-contexts: notebook_bridge=packages/notebook-bridge
          build-args: CACHE_EPOCH=${{ steps.epoch.outputs.value }}
          target: ${{ matrix.variant.target }}
          platforms: linux/${{ matrix.platform.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/marimo-sandbox:sha-${{ github.sha }}${{ matrix.variant.suffix }}-${{ matrix.platform.arch }}

      - name: Record digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          NAME: ${{ matrix.variant.target }}-${{ matrix.platform.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$NAME"

      - if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sandbox-digest-${{ matrix.variant.target }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.variant.target }}-${{ matrix.platform.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform manifests
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sandbox-digest-*
          merge-multiple: true
          path: digests

      - name: Read marimo version
        id: version
        run: |
          VERSION="$(sed -n 's/^ARG MARIMO_VERSION=//p' images/marimo-sandbox/Dockerfile)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid MARIMO_VERSION: $VERSION"
            exit 1
          fi
          echo "marimo=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish manifests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/marimo-sandbox
          REVISION: ${{ github.sha }}
          MARIMO_VERSION: ${{ steps.version.outputs.marimo }}
        run: |
          for target in release vscode opencode tools; do
            variant="-$target"
            [[ "$target" != release ]] || variant=''
            printf '%s\n' \
              "$IMAGE:latest$variant" \
              "$IMAGE:py3.13-marimo$MARIMO_VERSION$variant" \
              "$IMAGE:sha-$REVISION$variant" \
              | scripts/publish-image-manifest.sh \
                "$IMAGE@$(<"digests/$target-amd64")" "$IMAGE@$(<"digests/$target-arm64")"
          done
