name: Publish sandbox image

on:
  push:
    branches: [main]
    paths:
      - 'images/marimo-sandbox/Dockerfile'
      - 'packages/compute-fargate/agent/fargate_agent.py'
      - '.github/workflows/publish-sandbox-image.yml'
  pull_request:
    paths:
      - 'images/marimo-sandbox/Dockerfile'
      - 'packages/compute-fargate/agent/fargate_agent.py'
      - '.github/workflows/publish-sandbox-image.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read marimo version
        id: version
        run: |
          VERSION="$(sed -n 's/^ARG MARIMO_VERSION=//p' images/marimo-sandbox/Dockerfile)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid MARIMO_VERSION: $VERSION"
            exit 1
          fi
          echo "marimo=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and run acceptance tests
        run: |
          docker build -f images/marimo-sandbox/Dockerfile -t marimo-sandbox:ci .
          SKIP_BUILD=1 examples/sandbox-image/acceptance-test.sh marimo-sandbox:ci images/marimo-sandbox

      - name: Verify authenticated Fargate agent
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          container="marimohub-fargate-agent-ci"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --rm --name "$container" -p 2717:2717 \
            -e MARIMOHUB_AGENT_TOKEN="$token" -e MARIMOHUB_AGENT_PORT=2717 \
            marimo-sandbox:ci python3 /usr/local/lib/marimohub/fargate_agent.py >/dev/null
          for attempt in $(seq 1 30); do
            health="$(curl --retry 2 --retry-all-errors -fsS \
              -H "Authorization: Bearer $token" http://127.0.0.1:2717/health 2>/dev/null || true)"
            if jq -e '.ok == true and .protocolVersion == 1' <<<"$health" >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          sleep 1
          auth=(-H "Authorization: Bearer $token")
          curl --retry 2 --retry-all-errors -fsS "${auth[@]}" -H 'Content-Type: application/json' \
            -X POST http://127.0.0.1:2717/exec \
            -d '{"command":"printf smoke"}' \
            | jq -e '.success == true and .stdout == "smoke"' >/dev/null
          curl --retry 2 --retry-all-errors -fsS "${auth[@]}" -H 'Content-Type: application/json' \
            -X POST http://127.0.0.1:2717/files/write \
            -d '{"files":[{"path":"/tmp/fargate-agent-smoke.bin","contentBase64":"AP8B"}]}' \
            | jq -e '.written == 1' >/dev/null
          curl --retry 2 --retry-all-errors -fsS "${auth[@]}" \
            'http://127.0.0.1:2717/files/read?path=%2Ftmp%2Ffargate-agent-smoke.bin' \
            | jq -e '.contentBase64 == "AP8B"' >/dev/null
          process_id="$(curl --retry 2 --retry-all-errors -fsS "${auth[@]}" -H 'Content-Type: application/json' \
            -X POST http://127.0.0.1:2717/processes \
            -d '{"processId":"fargate-agent-smoke","command":"sleep 30"}' | jq -r .id)"
          test "$process_id" = fargate-agent-smoke
          curl --retry 2 --retry-all-errors -fsS "${auth[@]}" -X DELETE \
            "http://127.0.0.1:2717/processes/${process_id}?signal=TERM" >/dev/null

      - name: Build VS Code variant
        run: docker build --target vscode -f images/marimo-sandbox/Dockerfile -t marimo-sandbox:vscode-ci .

      - name: Verify VS Code variant
        run: |
          docker run --rm marimo-sandbox:vscode-ci code-server --version
          docker run --rm marimo-sandbox:vscode-ci sh -c '
            installed="$(code-server --list-extensions --extensions-dir /opt/marimohub/vscode-extensions)"
            for extension in marimo-team.vscode-marimo detachhead.basedpyright charliermarsh.ruff tamasfe.even-better-toml; do
              printf "%s\n" "$installed" | grep -Fx "$extension"
            done
          '

      - name: Build OpenCode variant
        run: docker build --target opencode -f images/marimo-sandbox/Dockerfile -t marimo-sandbox:opencode-ci .

      - name: Verify OpenCode variant
        run: |
          docker run --rm marimo-sandbox:opencode-ci opencode --version | grep -F '1.18.17'
          docker run --rm marimo-sandbox:opencode-ci jq --version
          docker run --rm marimo-sandbox:opencode-ci test -f /home/appuser/.agents/skills/marimo-pair/SKILL.md
          docker run --rm marimo-sandbox:opencode-ci sh -ec '
            opencode web --hostname 127.0.0.1 --port 4096 >/tmp/opencode.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            attempts=0
            until curl -fsS http://127.0.0.1:4096/global/health; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 30 ]; then
                cat /tmp/opencode.log
                exit 1
              fi
              sleep 1
            done
            curl -fsS -H "x-opencode-directory: /workspace" http://127.0.0.1:4096/skill \
              | jq -e ".[] | select(.name == \"marimo-pair\")" >/dev/null
          '

      - name: Build and verify combined tools variant
        run: |
          docker build --target tools -f images/marimo-sandbox/Dockerfile -t marimo-sandbox:tools-ci .
          docker run --rm marimo-sandbox:tools-ci code-server --version
          docker run --rm marimo-sandbox:tools-ci opencode --version | grep -F '1.18.17'
          docker run --rm marimo-sandbox:tools-ci jq --version
          docker run --rm marimo-sandbox:tools-ci test -f /home/appuser/.agents/skills/marimo-pair/SKILL.md
          docker run --rm marimo-sandbox:tools-ci sh -ec '
            opencode web --hostname 127.0.0.1 --port 4096 >/tmp/opencode.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            attempts=0
            until curl -fsS http://127.0.0.1:4096/global/health; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 30 ]; then
                cat /tmp/opencode.log
                exit 1
              fi
              sleep 1
            done
            curl -fsS -H "x-opencode-directory: /workspace" http://127.0.0.1:4096/skill \
              | jq -e ".[] | select(.name == \"marimo-pair\")" >/dev/null
          '

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: github.event_name == 'push'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/marimo-sandbox/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/marimo-sandbox:latest
            ghcr.io/${{ github.repository_owner }}/marimo-sandbox:py3.13-marimo${{ steps.version.outputs.marimo }}
            ghcr.io/${{ github.repository_owner }}/marimo-sandbox:sha-${{ github.sha }}

      - name: Publish VS Code variant
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/marimo-sandbox/Dockerfile
          target: vscode
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/marimo-sandbox:latest-vscode
            ghcr.io/${{ github.repository_owner }}/marimo-sandbox:py3.13-marimo${{ steps.version.outputs.marimo }}-vscode
            ghcr.io/${{ github.repository_owner }}/marimo-sandbox:sha-${{ github.sha }}-vscode

      - name: Publish OpenCode variant
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/marimo-sandbox/Dockerfile
          target: opencode
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/marimo-sandbox:latest-opencode
            ghcr.io/${{ github.repository_owner }}/marimo-sandbox:py3.13-marimo${{ steps.version.outputs.marimo }}-opencode
            ghcr.io/${{ github.repository_owner }}/marimo-sandbox:sha-${{ github.sha }}-opencode

      - name: Publish combined tools variant
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/marimo-sandbox/Dockerfile
          target: tools
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/marimo-sandbox:latest-tools
            ghcr.io/${{ github.repository_owner }}/marimo-sandbox:py3.13-marimo${{ steps.version.outputs.marimo }}-tools
            ghcr.io/${{ github.repository_owner }}/marimo-sandbox:sha-${{ github.sha }}-tools
