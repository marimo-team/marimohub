name: Docs issue
description: Report unclear, missing, or stale documentation.
title: '[Docs]: '
labels: ['docs']
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Link to the page or file path.
      placeholder: docs/getting-started.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is unclear, missing, wrong, or hard to follow?
    validations:
      required: true
  - type: textarea
    id: reader-goal
    attributes:
      label: Reader goal
      description: What were you trying to do?
      placeholder: I was trying to deploy with S3 and OIDC.
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested fix
      description: Optional. Include wording, links, or examples that would have helped.
